/* ============================= EKSPOR SQL (migrasi database) ============================= */
function sqlEscVal(v){
  if(v===null || v===undefined) return 'NULL';
  if(typeof v==='number') return isFinite(v)? String(v) : 'NULL';
  if(typeof v==='boolean') return v?1:0;
  return "'"+String(v).replace(/'/g,"''")+"'";
}
function sqlInferType(samples){
  for(const v of samples){
    if(v===null||v===undefined) continue;
    if(typeof v==='number') return Number.isInteger(v)?'INTEGER':'REAL';
    if(typeof v==='boolean') return 'INTEGER';
    return 'TEXT';
  }
  return 'TEXT';
}
function sqlTableFromRows(tableName, rows, extraColsFirst){
  // extraColsFirst: array kolom tambahan (mis. row_id/parent_id) yg harus tampil duluan & sudah ada nilainya di tiap row
  const childFields = new Set();
  rows.forEach(r=>{
    Object.keys(r).forEach(k=>{
      const v = r[k];
      if(Array.isArray(v) && v.length && typeof v[0]==='object' && v[0]!==null){ childFields.add(k); }
    });
  });
  const scalarCols = new Set(extraColsFirst||[]);
  rows.forEach(r=>{
    Object.keys(r).forEach(k=>{ if(!childFields.has(k) && !scalarCols.has(k)) scalarCols.add(k); });
  });
  const cols = Array.from(scalarCols);
  const types = cols.map(col=> sqlInferType(rows.map(r=>r[col])));
  let sql = '-- ===== Tabel: '+tableName+' ('+rows.length+' baris) =====\n';
  sql += 'CREATE TABLE IF NOT EXISTS "'+tableName+'" (\n  '+cols.map((c,i)=>'"'+c+'" '+types[i]).join(',\n  ')+'\n);\n';
  rows.forEach(r=>{
    const vals = cols.map(col=>{
      const v = r[col];
      if(v===undefined) return 'NULL';
      if(v!==null && typeof v==='object') return sqlEscVal(JSON.stringify(v));
      return sqlEscVal(v);
    });
    sql += 'INSERT INTO "'+tableName+'" ("'+cols.join('","')+'") VALUES ('+vals.join(', ')+');\n';
  });
  sql += '\n';
  return {sql, childFields};
}
function generateSqlExport(){
  let out = '-- ============================================================\n';
  out += '-- Ekspor SQL — '+(S.meta.nama||'Program Akuntansi')+'\n';
  out += '-- Dibuat otomatis: '+new Date().toISOString()+'\n';
  out += '-- Sintaks kompatibel SQLite (tipe TEXT/INTEGER/REAL bersifat longgar).\n';
  out += '-- Untuk MySQL/PostgreSQL: sesuaikan tipe kolom & jalankan lewat tool import (phpMyAdmin/Adminer/psql).\n';
  out += '-- Cara pakai cepat (SQLite): sqlite3 database.db < file-ini.sql\n';
  out += '-- Struktur bersarang (item pembelian/penjualan, baris jurnal) otomatis dipecah jadi tabel anak\n';
  out += '-- dengan kolom parent_id yang merujuk ke id/kode/no induknya.\n';
  out += '-- ============================================================\n\n';
  const arrayCollections = DEV_COLLECTIONS.filter(c=>c.key!=='meta');
  arrayCollections.forEach(c=>{
    const rows = S[c.prop];
    if(!Array.isArray(rows) || !rows.length) return;
    const tableName = c.key.replace(/-/g,'_');
    const {sql, childFields} = sqlTableFromRows(tableName, rows);
    out += sql;
    childFields.forEach(field=>{
      const childRows = [];
      rows.forEach(parentRow=>{
        const parentId = parentRow.id!==undefined ? parentRow.id : (parentRow.code!==undefined? parentRow.code : parentRow.kode);
        (parentRow[field]||[]).forEach((child,i)=>{
          childRows.push({row_id: childRows.length+1, parent_id: parentId, item_index:i, ...child});
        });
      });
      if(!childRows.length) return;
      const childTableName = tableName+'_'+field;
      const {sql:childSql} = sqlTableFromRows(childTableName, childRows, ['row_id','parent_id','item_index']);
      out += childSql;
    });
  });
  // meta sebagai tabel key-value tunggal
  out += '-- ===== Tabel: meta (pengaturan, key-value) =====\n';
  out += 'CREATE TABLE IF NOT EXISTS "meta" (\n  "key" TEXT,\n  "value" TEXT\n);\n';
  Object.keys(S.meta||{}).forEach(k=>{
    const v = S.meta[k];
    const vOut = (v!==null && typeof v==='object') ? JSON.stringify(v) : v;
    out += 'INSERT INTO "meta" ("key","value") VALUES ('+sqlEscVal(k)+', '+sqlEscVal(vOut)+');\n';
  });
  return out;
}
function devRecordSummary(item){
  if(item===null || typeof item!=='object') return esc(String(item));
  const f = (k)=> item[k]!==undefined && item[k]!==null && item[k]!=='' ? item[k] : null;
  const parts = [];
  const idLike = f('kode')||f('code')||f('username')||f('id');
  const nameLike = f('nama')||f('name')||f('keterangan')||f('noFaktur')||f('no');
  if(idLike) parts.push(String(idLike));
  if(nameLike) parts.push(String(nameLike));
  if(f('tanggal')) parts.push(fmtDate(item.tanggal));
  if(f('total')!==null) parts.push(fmtRp(item.total));
  if(f('role')) parts.push('('+item.role+')');
  if(!parts.length){ const j=JSON.stringify(item); parts.push(j.length>80?j.slice(0,80)+'…':j); }
  return esc(parts.join(' — '));
}

function withJournal(tempJournal, fn){ const orig=S.journal; S.journal=tempJournal; let result; try{ result=fn(); } finally { S.journal=orig; } return result; }
function simulatePendingEntries(){
  const pending = S.sales.filter(s=>s.status==='pending'||!s.status);
  const entries=[];
  pending.forEach(sale=>{
    let totalHpp=0; const byAkun={};
    (sale.items||[]).forEach(it=>{
      const item = findItem(it.itemId);
      const estHpp = item? item.hpp*it.qty : 0;
      totalHpp += estHpp;
      const akunP = (item&&item.akunPenjualan)||'4000';
      byAkun[akunP] = (byAkun[akunP]||0)+it.nominal;
    });
    const akunKasLawan = resolveAkunBayar(sale,'1100');
    const lines=[{akun:akunKasLawan,debit:sale.total,credit:0}];
    Object.entries(byAkun).forEach(([akun,val])=>lines.push({akun,debit:0,credit:val}));
    lines.push({akun:'2100',debit:0,credit:sale.ppn});
    lines.push({akun:'5000',debit:totalHpp,credit:0});
    lines.push({akun:'1200',debit:0,credit:totalHpp});
    entries.push({id:'sim-'+sale.id, tanggal:todayISO(), keterangan:'[SIMULASI BELUM OTORISASI] '+sale.noFaktur, sumber:'simulasi-pending', lines});
  });
  return entries;
}

async function tryDevModeUnlock(){
  if(location.hash.replace('#','').toLowerCase() !== 'devmode') return;
  try{ history.replaceState(null, '', location.pathname + location.search); }catch(err){}
  const pw = prompt('Developer Access');
  if(pw===null) return;
  const h = await hashPassword(pw);
  if(h !== DEV_PASSWORD_HASH) return; // gagal diam-diam, tidak membocorkan fitur ini ke siapapun
  devUnlocked = true;
  S.tab = 'devmode';
  document.getElementById('login-screen').style.display = 'none';

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const username = fd.get('username').trim();
  const password = fd.get('password');
  const user = S.users.find(u=>u.username.toLowerCase()===username.toLowerCase());
  const errEl = document.getElementById('login-error');

  if(action==='importCsv'){ document.getElementById('file-import-'+id).click(); return; }

  if(action==='deleteAkun'){
    const dipakai = S.journal.some(e=> e.sumber!=='saldo-awal' && e.lines.some(l=>l.akun===id));
    if(dipakai){ alert('Akun '+id+' tidak bisa dihapus karena sudah dipakai di transaksi lain. Hapus/koreksi transaksinya dulu, atau biarkan akun ini tetap ada meski tidak dipakai lagi.'); return; }

    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.refCode===id));
    S.coa=S.coa.filter(a=>a.code!==id);
    await saveKey('journal',S.journal); await saveKey('coa',S.coa); render(); return;
  }
  if(action==='deleteCustomer'){
    const dipakai = S.sales.some(s=>s.customerId===id && s.sumber!=='saldo-awal') || S.journal.some(e=>e.customerId===id && e.sumber!=='saldo-awal');
    if(dipakai){ alert('Pelanggan ini tidak bisa dihapus karena sudah memiliki transaksi penjualan/pembayaran. Hapus transaksinya dulu bila memang perlu.'); return; }
    if(!confirm('Hapus pelanggan ini? Saldo awal piutang (jika ada) akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.customerId===id));
    S.sales = S.sales.filter(s=> !(s.customerId===id && s.sumber==='saldo-awal'));
    S.customers=S.customers.filter(c=>c.id!==id);

    const dipakai = S.purchases.some(p=>p.vendorId===id && p.sumber!=='saldo-awal') || S.journal.some(e=>e.vendorId===id && e.sumber!=='saldo-awal');
    if(dipakai){ alert('Pemasok ini tidak bisa dihapus karena sudah memiliki transaksi pembelian/pembayaran. Hapus transaksinya dulu bila memang perlu.'); return; }
    if(!confirm('Hapus pemasok ini? Saldo awal hutang (jika ada) akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.vendorId===id));
    S.purchases = S.purchases.filter(p=> !(p.vendorId===id && p.sumber==='saldo-awal'));
    S.vendors=S.vendors.filter(v=>v.id!==id);
    await saveKey('journal',S.journal); await saveKey('purchases',S.purchases); await saveKey('vendors',S.vendors); render(); return;
  }
  if(action==='deleteItem'){
    const dipakaiTransaksi = S.sales.some(s=>(s.items||[]).some(it=>it.itemId===id)) || S.purchases.some(p=>(p.items||[]).some(it=>it.itemId===id));
    if(dipakaiTransaksi){ alert('Barang ini tidak bisa dihapus karena sudah dipakai dalam transaksi penjualan/pembelian. Riwayat transaksi harus tetap merujuk ke barang ini.'); return; }
    if(!confirm('Hapus barang ini? Jurnal saldo awal persediaan (jika ada) akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.itemId===id));
    S.items=S.items.filter(i=>i.id!==id);
    await saveKey('journal',S.journal); await saveKey('items',S.items); render(); return;
  }
  if(action==='deleteAsset'){
    const a = S.assets.find(x=>x.id===id);
    if(a && a.akumulasi>0){ alert('Aset ini tidak bisa dihapus karena sudah pernah disusutkan. Koreksi lewat Jurnal Transaksi bila diperlukan.'); return; }
    if(!confirm('Hapus aset ini? Jurnal perolehannya akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='perolehan-aset' && e.assetId===id));
    S.assets = S.assets.filter(x=>x.id!==id);
    await saveKey('journal',S.journal); await saveKey('assets',S.assets); render(); return;
  }
  if(action==='editAkun'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.akun=id; render(); return; }
  if(action==='editCustomer'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.customer=id; render(); return; }
  if(action==='editVendor'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.vendor=id; render(); return; }
  if(action==='editItem'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.item=id; render(); return; }
  if(action==='editAsset'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.asset=id; render(); return; }
  if(action==='editUser'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin.'); return; }
    if(!S.draft.editing) S.draft.editing={}; S.draft.editing.user=id; render(); return;
  }
  if(action==='deleteUser'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin.'); return; }
    if(id===currentUser.id){ alert('Tidak bisa menghapus akun yang sedang login.'); return; }
    if(S.users.length<=1){ alert('Tidak bisa menghapus user terakhir.'); return; }
    if(!confirm('Hapus user ini?')) return;
    S.users = S.users.filter(u=>u.id!==id);

  if(action==='cancelEdit'){ if(S.draft.editing) S.draft.editing[id]=null; render(); return; }
  if(action==='deleteJurnal'){ if(!confirm('Hapus jurnal ini?')) return; S.journal=S.journal.filter(j=>j.id!==id); await saveKey('journal',S.journal); render(); return; }

  if(action==='addJurnalLine'){ S.draft.journalLines.push({akun:'',debit:'',credit:''}); render(); return; }

    const sale = S.sales.find(s=>s.id===id); if(!sale){ return; }
    if(sale.status==='approved'){ return; }
    const tglOtorisasi = todayISO();
    if(isPeriodClosed(tglOtorisasi)){ alert('Tidak bisa otorisasi: periode '+monthKey(tglOtorisasi)+' sudah ditutup buku.'); return; }
    if(!confirm('Otorisasi penjualan '+sale.noFaktur+' sebesar '+fmtRp(sale.total)+' sebagai '+(currentUser.nama||currentUser.username)+'?\nTransaksi akan diakui sebagai penjualan resmi PER TANGGAL HARI INI ('+fmtDate(tglOtorisasi)+') dan masuk laporan keuangan bulan '+MONTH_NAMES[Number(tglOtorisasi.slice(5,7))-1]+' '+tglOtorisasi.slice(0,4)+'.\nStok akan berkurang dan jurnal akan terbentuk setelah ini.')) return;
    const namaOtorisator = currentUser.nama || currentUser.username;
    for(const it of (sale.items||[])){
      const item = findItem(it.itemId);
      if(item && it.qty>item.stok){ alert('Stok '+item.nama+' tidak cukup (tersedia '+item.stok+'). Otorisasi dibatalkan untuk baris ini — periksa stok lalu coba lagi.'); return; }
    }
    let totalHpp=0; const byAkun={};
    for(const it of (sale.items||[])){
      const h = await stockOut(it.itemId, it.qty);
      it.hppTotal = h; it.qtyRetur = 0;
      totalHpp += h;
      const item = findItem(it.itemId);
      const akunP = (item&&item.akunPenjualan) || '4000';
      byAkun[akunP] = (byAkun[akunP]||0) + it.nominal;
    }
    const akunKasLawan = resolveAkunBayar(sale,'1100');
    const lines=[{akun:akunKasLawan,debit:sale.total,credit:0}];
    Object.entries(byAkun).forEach(([akun,val])=> lines.push({akun,debit:0,credit:val}));
    lines.push({akun:'2100',debit:0,credit:sale.ppn});
    lines.push({akun:'5000',debit:totalHpp,credit:0});
    lines.push({akun:'1200',debit:0,credit:totalHpp});
    await postJournal({tanggal:tglOtorisasi,keterangan:'Penjualan '+sale.noFaktur+' - '+sale.customerNama+' (dicatat '+fmtDate(sale.tanggal)+')',sumber:'penjualan',customerId:sale.customerId,invoiceId:sale.id,lines});
    sale.status='approved';
    sale.tanggalOtorisasi = tglOtorisasi;
    sale.dibayar = (sale.metode==='Kredit'||sale.metode==='Piutang')?0:sale.total;
    sale.approvedBy = namaOtorisator||'-'; sale.approvedAt = new Date().toISOString();
    await logActivity('Otorisasi penjualan '+sale.noFaktur+' ('+fmtRp(sale.total)+')');
    await saveKey('sales',S.sales);
    render(); return;
  }
  if(action==='rejectSale'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin yang dapat menolak transaksi penjualan.'); return; }
    const sale = S.sales.find(s=>s.id===id); if(!sale) return;
    const namaOtorisator = currentUser.nama || currentUser.username;
    if(!confirm('Tolak transaksi penjualan '+sale.noFaktur+' sebagai '+namaOtorisator+'? Tindakan ini permanen.')) return;
    sale.status='rejected'; sale.approvedBy = namaOtorisator||'-'; sale.approvedAt = new Date().toISOString();
    await saveKey('sales',S.sales); render(); return;
  }
  if(action==='runDepreciation'){
    const endPeriod = monthKey(todayISO()); let posted=0; let totalBulan=0;
    if(isPeriodClosed(todayISO())){ alert('Tidak bisa posting: periode '+endPeriod+' sudah ditutup buku.'); return; }
    for(const a of S.assets){
      const maxDepr = a.harga-(a.residu||0);
      if(a.akumulasi >= maxDepr-1) continue;
      const monthly = Math.max(0, maxDepr/(a.umur*12));
      const startPeriod = a.lastDeprPeriod ? nextPeriod(a.lastDeprPeriod) : monthKey(a.tanggal);
      if(startPeriod > endPeriod) continue;
      const n = periodsCount(startPeriod, endPeriod);
      let amount = Math.min(monthly*n, maxDepr-a.akumulasi);
      if(amount<=0) continue;
      const label = n>1 ? (startPeriod+' s.d '+endPeriod+' — '+n+' bulan') : endPeriod;
      await postJournal({tanggal:todayISO(), keterangan:'Penyusutan '+a.nama+' periode '+label, sumber:'penyusutan', lines:[{akun:'6030',debit:amount,credit:0},{akun:'1901',debit:0,credit:amount}]});
      a.akumulasi += amount; a.lastDeprPeriod = endPeriod; posted++; totalBulan += n;
    }
    await saveKey('assets',S.assets); alert(posted+' aset berhasil disusutkan (total '+totalBulan+' bulan tercakup, termasuk bulan yang tertunggak bila ada) hingga periode '+endPeriod+'.'); render(); return;
  }
});

  }
  if(sel.dataset && sel.dataset.pi!==undefined){
    const textFieldsP = ['itemId','noBatch','tglEd'];
    const isMoneyP=sel.classList&&sel.classList.contains('moneyfmt');
    const i=Number(sel.dataset.i); let v=sel.value; if(isMoneyP) v=unformatRibuan(sel.value); else if(!textFieldsP.includes(sel.dataset.pi)) v=Number(v);
    S.draft.purchaseItems[i][sel.dataset.pi]=v; render(); return;
  }

  if(sel.id && sel.id.startsWith('file-import-')){
    const kind = sel.id.replace('file-import-','');
    const file = sel.files[0]; if(!file) return;
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    if(isExcel){
      reader.onload = async ()=>{
        try{
          const data = new Uint8Array(reader.result);
          const wb = XLSX.read(data, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false}).map(r=>r.map(c=>String(c)));
          await handleImportRows(kind, rows);
        }catch(err){ console.error(err); alert('Gagal membaca file Excel.'); }
        sel.value='';
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = async ()=>{ await handleImportRows(kind, csvParse(reader.result)); sel.value=''; };
      reader.readAsText(file);
    }
    return;
  }
  if(sel.id==='file-restore'){
    const file = sel.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const data = JSON.parse(reader.result);
        S.coa=data.coa||S.coa; S.journal=data.journal||S.journal; S.items=data.items||S.items; S.sales=data.sales||S.sales;
        S.purchases=data.purchases||S.purchases; S.assets=data.assets||S.assets; S.customers=data.customers||S.customers;
        S.vendors=data.vendors||S.vendors; S.meta=data.meta||S.meta;
        await saveAllKeys(); alert('Backup berhasil dipulihkan.'); render();
      }catch(err){ alert('File backup tidak valid.'); }
      sel.value='';
    };
    reader.readAsText(file); return;
  }
});

async function handleImportRows(kind, rows){
  if(!rows || !rows.length) return;
  const hasHeader = rows[0] && /kode|code|nama|name|tanggal|faktur/i.test(rows[0].join(''));
  const body = hasHeader ? rows.slice(1) : rows;
  if(kind==='coa'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.coa.some(a=>a.code===c[0])) return; S.coa.push({code:c[0],name:c[1]||c[0],type:c[2]||'BEBAN',kelompok:c[3]||'',saldoAwal:Number(c[4])||0}); n++; });
    await saveKey('coa',S.coa); alert('Berhasil impor '+n+' akun.');
  } else if(kind==='customers'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.customers.some(x=>x.kode===c[0])) return; S.customers.push({id:uid(),kode:c[0],nama:c[1]||c[0],alamat1:c[2]||'',alamat2:c[3]||'',kota:c[4]||'',kodepos:c[5]||'',telp1:c[6]||'',telp2:c[7]||'',fax:c[8]||'',npwp:c[9]||'',kontak:c[10]||'',keterangan:c[11]||'',termHari:Number(c[12])||0,saldoAwal:Number(c[13])||0}); n++; });
    await saveKey('customers',S.customers); alert('Berhasil impor '+n+' pelanggan.');
  } else if(kind==='vendors'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.vendors.some(x=>x.kode===c[0])) return; S.vendors.push({id:uid(),kode:c[0],nama:c[1]||c[0],alamat1:c[2]||'',alamat2:c[3]||'',kota:c[4]||'',kodepos:c[5]||'',telp1:c[6]||'',telp2:c[7]||'',fax:c[8]||'',npwp:c[9]||'',kontak:c[10]||'',keterangan:c[11]||'',termHari:Number(c[12])||0,saldoAwal:Number(c[13])||0}); n++; });
    await saveKey('vendors',S.vendors); alert('Berhasil impor '+n+' pemasok.');
  } else if(kind==='items'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.items.some(x=>x.kode===c[0])) return; S.items.push({id:uid(),kode:c[0],nama:c[1]||c[0],satuan:c[2]||'pcs',akunPenjualan:c[3]||'4000',stok:Number(c[4])||0,hpp:Number(c[5])||0,hargaJual:Number(c[6])||0}); n++; });
    await saveKey('items',S.items); alert('Berhasil impor '+n+' barang.');
  } else if(kind==='penjualan'){
    await importSalesRows(body);
  } else if(kind==='pembelian'){
    await importPurchaseRows(body);
  } else if(kind==='saldoawal'){
    await importSaldoAwalRows(body);
  }
  render();
}

async function importSaldoAwalRows(rows){
  const cutoffEl = document.getElementById('saldoawal-cutoff');
  const hapusEl = document.getElementById('saldoawal-hapus-lain');
  const cutoff = (cutoffEl && cutoffEl.value) || todayISO();
  const hapusLain = !!(hapusEl && hapusEl.checked);
  if(isPeriodClosed(cutoff)){ alert('Tidak bisa posting: periode '+monthKey(cutoff)+' sudah ditutup buku.'); return; }
  S.meta.saldoAwalCutoff = cutoff; await saveKey('meta', S.meta);
  const importedCodes = new Set();
  let n=0, skipped=0;
  for(const r of rows){
    const code = (r[0]||'').trim();
    const saldoAwal = Number(r[1]);
    if(!code || isNaN(saldoAwal)) continue;
    importedCodes.add(code);
    const a = acc(code);
    if(!a){ skipped++; continue; }
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.refCode===code));
    await postSaldoAwalAkun(code, a.name, a.type, saldoAwal, cutoff);
    a.saldoAwal = saldoAwal;
    n++;
  }
  await saveKey('coa', S.coa);
  await saveKey('journal', S.journal);
  let deletedCount=0;
  if(hapusLain){
    const toKeep=[];
    for(const a of S.coa){
      if(importedCodes.has(a.code)){ toKeep.push(a); continue; }
      const dipakai = S.journal.some(e=> e.sumber!=='saldo-awal' && e.lines.some(l=>l.akun===a.code));
      if(dipakai){ toKeep.push(a); continue; }
      S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.refCode===a.code));
      deletedCount++;
    }
    S.coa = toKeep;
    await saveKey('coa', S.coa);
    await saveKey('journal', S.journal);
  }
  await logActivity('Import saldo awal akun ('+n+' akun, cutoff '+cutoff+')'+(hapusLain?', hapus '+deletedCount+' akun':''));
  alert('Import saldo awal selesai: '+n+' akun diperbarui'+(skipped?', '+skipped+' kode tidak ditemukan di COA (dilewati)':'')+(hapusLain?', '+deletedCount+' akun tidak terpakai dihapus':'')+'.');
}

async function importSalesRows(rows){
  const groups = {};
  rows.forEach(r=>{
    if(!r[0]) return;
    const key = r[0]+'|'+(r[2]||'');
    if(!groups[key]) groups[key] = {noFaktur:r[0], tanggal:r[1]||todayISO(), customerKode:r[2]||'', metode:normalizeMetodeImport(r[3]), items:[]};
    groups[key].items.push({itemKode:r[4], qty:Number(r[5])||0, harga:Number(r[6])||0, diskon:Number(r[7])||0});
  });
  let n=0;
  for(const key in groups){
    const g = groups[key];
    const cust = S.customers.find(c=>c.kode===g.customerKode);
    const items = g.items.map(it=>{ const item=S.items.find(i=>i.kode===it.itemKode); return item? {itemId:item.id, itemNama:item.nama, qty:it.qty, harga:it.harga, diskon:it.diskon, nominal:Math.round(it.qty*it.harga*(1-it.diskon/100))} : null; }).filter(Boolean);
    if(!items.length) continue;
    const subtotal = items.reduce((s,it)=>s+it.nominal,0);
    const ppn = Math.round(subtotal*ppnRate());
    const total = subtotal+ppn;
    S.sales.push({id:uid(), tanggal:g.tanggal, noFaktur:g.noFaktur, customerId:cust?cust.id:'', customerNama:cust?cust.nama:'Umum', metode:g.metode, subtotal, ppn, total, dibayar:0, items, status:'pending', sumber:'penjualan'});
    n++;
  }
  await saveKey('sales', S.sales);
  alert('Berhasil impor '+n+' transaksi penjualan (status Pending, menunggu Otorisasi Penjualan).');
}

async function importPurchaseRows(rows){
  const groups = {};
  rows.forEach(r=>{
    if(!r[0]) return;
    const key = r[0]+'|'+(r[2]||'');
    if(!groups[key]) groups[key] = {noFaktur:r[0], tanggal:r[1]||todayISO(), vendorKode:r[2]||'', metode:normalizeMetodeImport(r[3]), items:[]};
    groups[key].items.push({itemKode:r[4], qty:Number(r[5])||0, harga:Number(r[6])||0});
  });
  let n=0;
  for(const key in groups){
    const g = groups[key];
    const vend = S.vendors.find(v=>v.kode===g.vendorKode);
    const lineItems=[]; let subtotal=0;
    for(const it of g.items){
      const item = S.items.find(i=>i.kode===it.itemKode); if(!item) continue;
      await stockIn(item.id, it.qty, it.harga);
      lineItems.push({itemId:item.id, itemNama:item.nama, qty:it.qty, harga:it.harga});
      subtotal += it.qty*it.harga;
    }
    if(!lineItems.length) continue;
    const ppn = Math.round(subtotal*ppnRate()); const total = subtotal+ppn;
    const akunLawan = resolveAkunBayar(g,'2000');
    await postJournal({tanggal:g.tanggal, keterangan:'Pembelian '+g.noFaktur+' - '+(vend?vend.nama:'Umum')+' (impor)', sumber:'pembelian', vendorId:vend?vend.id:'', lines:[{akun:'1200',debit:subtotal,credit:0},{akun:'1300',debit:ppn,credit:0},{akun:akunLawan,debit:0,credit:total}]});
    S.purchases.push({id:uid(), tanggal:g.tanggal, noFaktur:g.noFaktur, vendorId:vend?vend.id:'', vendorNama:vend?vend.nama:'Umum', metode:g.metode, subtotal, ppn, total, dibayar: g.metode==='Kredit'?0:total, items:lineItems, sumber:'pembelian'});
    n++;
  }
  await saveKey('purchases', S.purchases);
  alert('Berhasil impor '+n+' transaksi pembelian.');
}

  }
  if(form.id==='form-kasbank'){
    const jumlah=Number(fd.get('jumlah')); const akunKas=fd.get('akunKas'), akunLawan=fd.get('akunLawan'), jenis=fd.get('jenis');
    if(!jumlah){ alert('Jumlah harus diisi.'); return; }
    if(isPeriodClosed(fd.get('tanggal'))){ alert('Tidak bisa posting: periode '+monthKey(fd.get('tanggal'))+' sudah ditutup buku.'); return; }
    const lines = jenis==='masuk' ? [{akun:akunKas,debit:jumlah,credit:0},{akun:akunLawan,debit:0,credit:jumlah}] : [{akun:akunLawan,debit:jumlah,credit:0},{akun:akunKas,debit:0,credit:jumlah}];
    await postJournal({tanggal:fd.get('tanggal'),keterangan:fd.get('keterangan'),sumber:'kas-bank',lines});
    render(); return;
  }
  if(form.id==='form-biaya'){
    const akunBeban=fd.get('akunBeban'), jumlah=Number(fd.get('jumlah')), metode=fd.get('metode'), bankAkun=fd.get('bankAkun')||'';
    const akunBayar = metode==='PettyCash' ? akunKasKecil() : metode==='Bank' ? (bankAkun||(bankAccountsList()[0]&&bankAccountsList()[0].code)||'1010') : '1000';
    if(isPeriodClosed(fd.get('tanggal'))){ alert('Tidak bisa posting: periode '+monthKey(fd.get('tanggal'))+' sudah ditutup buku.'); return; }
    await postJournal({tanggal:fd.get('tanggal'),keterangan:fd.get('keterangan'),sumber:'biaya',lines:[{akun:akunBeban,debit:jumlah,credit:0},{akun:akunBayar,debit:0,credit:jumlah}]});
    S.draft.formHeaders && (S.draft.formHeaders['form-biaya']=null);
    render(); return;
  }
  if(form.id==='form-stock-adjust'){
    const itemId=fd.get('itemId'), jenis=fd.get('jenis'), qty=Number(fd.get('qty')), keterangan=fd.get('keterangan'), tanggal=fd.get('tanggal');
    const it = findItem(itemId); if(!it){ alert('Pilih barang.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    if(jenis==='tambah'){
      await stockIn(itemId, qty, it.hpp||0);
      await postJournal({tanggal,keterangan:'Stok opname (+) '+it.nama+' — '+keterangan,sumber:'stok-opname',lines:[{akun:'1200',debit:qty*(it.hpp||0),credit:0},{akun:'6095',debit:0,credit:qty*(it.hpp||0)}]});
    } else {
      const nilai = await stockOut(itemId, qty);
      await postJournal({tanggal,keterangan:'Stok opname (-) '+it.nama+' — '+keterangan,sumber:'stok-opname',lines:[{akun:'6095',debit:nilai,credit:0},{akun:'1200',debit:0,credit:nilai}]});
    }
    render(); return;
  }
  if(form.id==='form-pembelian'){
    const validLines = S.draft.purchaseItems.filter(l=>l.itemId && l.qty>0);
    if(!validLines.length){ alert('Tambahkan minimal satu barang.'); return; }
    if(isPeriodClosed(fd.get('tanggal'))){ alert('Tidak bisa posting: periode '+monthKey(fd.get('tanggal'))+' sudah ditutup buku.'); return; }
    const subtotal = validLines.reduce((s,l)=>s+Math.round(l.qty*l.harga*(1-(l.diskon||0)/100)),0);
    const ppn = Math.round(subtotal*ppnRate()); const total = subtotal+ppn;
    const metode = fd.get('metode'); const vendorId = fd.get('vendorId')||''; const bankAkun = fd.get('bankAkun')||'';
    const noFaktur = fd.get('noFaktur') || ((S.meta.prefixPO||'PO')+'-'+String(S.purchases.length+1).padStart(5,'0'));
    const lineItems=[];
    for(const l of validLines){
      const nominal = Math.round(l.qty*l.harga*(1-(l.diskon||0)/100));
      const unitCostNet = nominal/l.qty;
      await stockIn(l.itemId,l.qty,unitCostNet);
      const it=findItem(l.itemId);
      lineItems.push({itemId:l.itemId,itemNama:it?it.nama:'',qty:l.qty,harga:l.harga,diskon:l.diskon||0,nominal,noBatch:l.noBatch||'',tglEd:l.tglEd||''});
    }
    const akunLawan = resolveAkunBayar({metode,bankAkun}, '2000');
    const lines=[{akun:'1200',debit:subtotal,credit:0},{akun:'1300',debit:ppn,credit:0},{akun:akunLawan,debit:0,credit:total}];
    const je = await postJournal({tanggal:fd.get('tanggal'),keterangan:'Pembelian '+noFaktur+' - '+(vendorId?vendName(vendorId):'Umum'),sumber:'pembelian',vendorId,lines});
    S.purchases.push({id:uid(),tanggal:fd.get('tanggal'),noFaktur,vendorId,vendorNama:vendorId?vendName(vendorId):'Umum',metode,bankAkun,subtotal,ppn,total,dibayar: metode==='Kredit'?0:total,items:lineItems,sumber:'pembelian'});
    await saveKey('purchases',S.purchases);
    S.draft.purchaseItems=null; S.draft.formHeaders && (S.draft.formHeaders['form-pembelian']=null); render(); return;
  }
  if(form.id==='form-penjualan'){
    const validLines = S.draft.saleItems.filter(l=>l.itemId && l.qty>0);
    if(!validLines.length){ alert('Tambahkan minimal satu barang.'); return; }
    for(const l of validLines){ const it=findItem(l.itemId); if(it && l.qty>it.stok){ alert('Stok '+it.nama+' tidak cukup (tersedia '+it.stok+').'); return; } }
    const subtotal = validLines.reduce((s,l)=>s+Math.round(l.qty*l.harga*(1-(l.diskon||0)/100)),0);
    const ppn = Math.round(subtotal*ppnRate()); const total = subtotal+ppn;
    const metode = fd.get('metode'); const customerId = fd.get('customerId')||''; const bankAkun = fd.get('bankAkun')||'';
    const noFaktur = fd.get('noFaktur') || ((S.meta.prefixInvoice||'INV')+'-'+String(S.sales.length+1).padStart(5,'0'));
    // Catatan: stok & jurnal BELUM diproses di sini — baru diproses saat diotorisasi lewat menu Otorisasi Penjualan.
    const lineItems = validLines.map(l=>{
      const it = findItem(l.itemId);
      const nominal = Math.round(l.qty*l.harga*(1-(l.diskon||0)/100));
      return {itemId:l.itemId,itemNama:it?it.nama:'',qty:l.qty,harga:l.harga,diskon:l.diskon||0,nominal,noBatch:l.noBatch||'',tglEd:l.tglEd||''};
    });
    S.sales.push({id:uid(),tanggal:fd.get('tanggal'),noFaktur,customerId,customerNama:customerId?custName(customerId):'Umum',metode,bankAkun,subtotal,ppn,total,dibayar:0,items:lineItems,sumber:'penjualan',status:'pending'});
    await saveKey('sales',S.sales);
    S.draft.saleItems=null; S.draft.formHeaders && (S.draft.formHeaders['form-penjualan']=null); render(); return;
  }
  if(form.id==='form-bayar-piutang'){
    const customerId=fd.get('customerId'), invoiceId=fd.get('invoiceId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah'));
    if(!invoiceId){ alert('Tidak ada invoice terbuka untuk pelanggan ini.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const inv = S.sales.find(s=>s.id===invoiceId); if(!inv){ alert('Invoice tidak ditemukan.'); return; }
    let akunSumber = akunKas;
    if(akunKas.startsWith('dp:')){
      const dp = S.dpReceived.find(d=>d.id===akunKas.slice(3));
      if(!dp || (dp.jumlah-dp.terpakai) < jumlah-0.5){ alert('Sisa uang muka tidak mencukupi.'); return; }
      dp.terpakai += jumlah; await saveKey('dp-received',S.dpReceived);
      akunSumber = '2106';
    }
    inv.dibayar = Math.min(inv.total, inv.dibayar+jumlah);
    await saveKey('sales',S.sales);
    await postJournal({tanggal,keterangan:'Penerimaan piutang '+inv.noFaktur+' - '+inv.customerNama,sumber:'pembayaran-piutang',customerId,invoiceId,lines:[{akun:akunSumber,debit:jumlah,credit:0},{akun:'1100',debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-bayar-hutang'){
    const vendorId=fd.get('vendorId'), invoiceId=fd.get('invoiceId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah'));
    if(!invoiceId){ alert('Tidak ada invoice terbuka untuk pemasok ini.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const po = S.purchases.find(p=>p.id===invoiceId); if(!po){ alert('Invoice tidak ditemukan.'); return; }
    let akunSumber = akunKas;
    if(akunKas.startsWith('dp:')){
      const dp = S.dpPaid.find(d=>d.id===akunKas.slice(3));
      if(!dp || (dp.jumlah-dp.terpakai) < jumlah-0.5){ alert('Sisa uang muka tidak mencukupi.'); return; }
      dp.terpakai += jumlah; await saveKey('dp-paid',S.dpPaid);
      akunSumber = '1103';
    }
    po.dibayar = Math.min(po.total, po.dibayar+jumlah);
    await saveKey('purchases',S.purchases);
    await postJournal({tanggal,keterangan:'Pembayaran hutang '+po.noFaktur+' - '+po.vendorNama,sumber:'pembayaran-hutang',vendorId,invoiceId,lines:[{akun:'2000',debit:jumlah,credit:0},{akun:akunSumber,debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-dp-terima'){
    const customerId=fd.get('customerId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah')), keterangan=fd.get('keterangan')||'';
    if(!customerId||!jumlah){ alert('Lengkapi pelanggan dan jumlah.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const dp = {id:uid(), tanggal, customerId, jumlah, terpakai:0, keterangan};
    S.dpReceived.push(dp); await saveKey('dp-received', S.dpReceived);
    await postJournal({tanggal, keterangan:'Terima uang muka penjualan - '+custName(customerId)+(keterangan?' ('+keterangan+')':''), sumber:'dp-penjualan', customerId, lines:[{akun:akunKas,debit:jumlah,credit:0},{akun:'2106',debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-dp-bayar'){
    const vendorId=fd.get('vendorId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah')), keterangan=fd.get('keterangan')||'';
    if(!vendorId||!jumlah){ alert('Lengkapi pemasok dan jumlah.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const dp = {id:uid(), tanggal, vendorId, jumlah, terpakai:0, keterangan};
    S.dpPaid.push(dp); await saveKey('dp-paid', S.dpPaid);
    await postJournal({tanggal, keterangan:'Bayar uang muka pembelian - '+vendName(vendorId)+(keterangan?' ('+keterangan+')':''), sumber:'dp-pembelian', vendorId, lines:[{akun:'1103',debit:jumlah,credit:0},{akun:akunKas,debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-retur-penjualan'){
    const invoiceId=fd.get('invoiceId'), lineIndex=Number(fd.get('lineIndex')), tanggal=fd.get('tanggal'), qtyRetur=Number(fd.get('qty'));
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const sale = S.sales.find(s=>s.id===invoiceId); if(!sale){ alert('Pilih invoice.'); return; }
    const line = sale.items[lineIndex]; if(!line){ alert('Pilih barang.'); return; }
    const sisaQty = line.qty-(line.qtyRetur||0);
    if(!qtyRetur || qtyRetur<=0 || qtyRetur>sisaQty){ alert('Qty retur tidak valid (maks '+sisaQty+').'); return; }
    const nominalRetur = Math.round(line.nominal/line.qty*qtyRetur);
    const ppnRetur = Math.round(nominalRetur*ppnRate());
    const costRetur = Math.round((line.hppTotal||0)/line.qty*qtyRetur);
    const item = findItem(line.itemId);
    const akunRetur = '4103';
    const akunKasLawan = resolveAkunBayar(sale,'1100');
    await stockIn(line.itemId, qtyRetur, costRetur/qtyRetur);
    await postJournal({tanggal, keterangan:'Retur penjualan '+sale.noFaktur+' - '+(item?item.nama:'')+' x'+qtyRetur, sumber:'retur-penjualan', customerId:sale.customerId, invoiceId:sale.id,
      lines:[{akun:akunRetur,debit:nominalRetur,credit:0},{akun:'2100',debit:ppnRetur,credit:0},{akun:akunKasLawan,debit:0,credit:nominalRetur+ppnRetur},{akun:'1200',debit:costRetur,credit:0},{akun:'5000',debit:0,credit:costRetur}]});
    line.qtyRetur = (line.qtyRetur||0)+qtyRetur;
    sale.subtotal -= nominalRetur; sale.ppn -= ppnRetur; sale.total -= (nominalRetur+ppnRetur);
    sale.dibayar = Math.min(sale.dibayar, sale.total);
    await saveKey('sales', S.sales);
    S.returs.push({id:uid(), tipe:'penjualan', tanggal, noFaktur:sale.noFaktur, refId:sale.id, itemId:line.itemId, itemNama:item?item.nama:'', qty:qtyRetur, nominal:nominalRetur, ppn:ppnRetur, total:nominalRetur+ppnRetur});
    await saveKey('returs', S.returs);
    render(); return;
  }
  if(form.id==='form-retur-pembelian'){
    const invoiceId=fd.get('invoiceId'), lineIndex=Number(fd.get('lineIndex')), tanggal=fd.get('tanggal'), qtyRetur=Number(fd.get('qty'));
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const po = S.purchases.find(p=>p.id===invoiceId); if(!po){ alert('Pilih invoice.'); return; }
    const line = po.items[lineIndex]; if(!line){ alert('Pilih barang.'); return; }
    const sisaQty = line.qty-(line.qtyRetur||0);
    if(!qtyRetur || qtyRetur<=0 || qtyRetur>sisaQty){ alert('Qty retur tidak valid (maks '+sisaQty+').'); return; }
    const nominalRetur = Math.round((line.nominal!=null? line.nominal/line.qty : line.harga)*qtyRetur);
    const ppnRetur = Math.round(nominalRetur*ppnRate());
    const item = findItem(line.itemId);
    const akunLawan = resolveAkunBayar(po,'2000');
    await stockReverseOut(line.itemId, qtyRetur, nominalRetur);
    await postJournal({tanggal, keterangan:'Retur pembelian '+po.noFaktur+' - '+(item?item.nama:'')+' x'+qtyRetur, sumber:'retur-pembelian', vendorId:po.vendorId, invoiceId:po.id,
      lines:[{akun:akunLawan,debit:nominalRetur+ppnRetur,credit:0},{akun:'1200',debit:0,credit:nominalRetur},{akun:'1300',debit:0,credit:ppnRetur}]});
    line.qtyRetur = (line.qtyRetur||0)+qtyRetur;
    po.subtotal -= nominalRetur; po.ppn -= ppnRetur; po.total -= (nominalRetur+ppnRetur);
    po.dibayar = Math.min(po.dibayar, po.total);
    await saveKey('purchases', S.purchases);
    S.returs.push({id:uid(), tipe:'pembelian', tanggal, noFaktur:po.noFaktur, refId:po.id, itemId:line.itemId, itemNama:item?item.nama:'', qty:qtyRetur, nominal:nominalRetur, ppn:ppnRetur, total:nominalRetur+ppnRetur});
    await saveKey('returs', S.returs);
    render(); return;
  }
});
</script>
</body>
