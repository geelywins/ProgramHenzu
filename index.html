document.addEventListener('change', (e)=>{
  const sel = e.target;
  if(sel.id==='bb-select'){ S.draft.bbAkun=sel.value; render(); return; }
  if(sel.id==='kb-select'){ S.draft.kbAkun=sel.value; render(); return; }
  if(sel.id==='ns-start'){ S.draft.nsStart=sel.value; render(); return; }
  if(sel.id==='ns-end'){ S.draft.nsEnd=sel.value; render(); return; }
  if(sel.id==='na-tahun'){ S.draft.naTahun=Number(sel.value); render(); return; }
  if(sel.id==='lr-tahun'){ S.draft.lrTahun=Number(sel.value); render(); return; }
  if(sel.id==='kum-tahun'){ S.draft.kumTahun=Number(sel.value); render(); return; }
  if(sel.id==='rinc-end'){ S.draft.rincEnd=sel.value; render(); return; }
  if(sel.id==='pel-start'){ S.draft.pelStart=sel.value; render(); return; }
  if(sel.id==='pel-end'){ S.draft.pelEnd=sel.value; render(); return; }
  if(sel.id==='lp-start'){ S.draft.lpStart=sel.value; render(); return; }
  if(sel.id==='lp-end'){ S.draft.lpEnd=sel.value; render(); return; }
  if(sel.id==='lp-customer'){ S.draft.lpCustomer=sel.value; render(); return; }
  if(sel.id==='lpb-start'){ S.draft.lpbStart=sel.value; render(); return; }
  if(sel.id==='lpb-end'){ S.draft.lpbEnd=sel.value; render(); return; }
  if(sel.id==='lpb-vendor'){ S.draft.lpbVendor=sel.value; render(); return; }
  if(sel.id==='pb-tahun'){ S.draft.pbTahun=Number(sel.value); render(); return; }
  if(sel.id==='bbp-select'){ S.draft.bbpCustomer=sel.value; render(); return; }
  if(sel.id==='bbh-select'){ S.draft.bbhVendor=sel.value; render(); return; }
  if(sel.id==='hp-cust-select'){ S.draft.hpCustomer=sel.value; render(); return; }
  if(sel.id==='hp-vend-select'){ S.draft.hpVendor=sel.value; render(); return; }
  if(sel.id==='retur-invoice-select'){ S.draft.returInvoice=sel.value; render(); return; }
  if(sel.id==='retur-invoice-pb-select'){ S.draft.returInvoicePb=sel.value; render(); return; }

  if(sel.dataset && sel.dataset.jl!==undefined){ const i=Number(sel.dataset.i); S.draft.journalLines[i][sel.dataset.jl]=sel.value; render(); return; }
  if(sel.dataset && sel.dataset.si!==undefined){
    const textFields = ['itemId','noBatch','tglEd'];
    const i=Number(sel.dataset.i); let v=sel.value; if(!textFields.includes(sel.dataset.si)) v=Number(v);
    S.draft.saleItems[i][sel.dataset.si]=v;
    if(sel.dataset.si==='itemId'){ const it=findItem(v); if(it && !S.draft.saleItems[i].harga) S.draft.saleItems[i].harga = (it.hargaJual && it.hargaJual>0) ? it.hargaJual : Math.round(it.hpp*1.25); }
    render(); return;
  }
  if(sel.dataset && sel.dataset.pi!==undefined){
    const textFieldsP = ['itemId','noBatch','tglEd'];
    const i=Number(sel.dataset.i); let v=sel.value; if(!textFieldsP.includes(sel.dataset.pi)) v=Number(v);
    S.draft.purchaseItems[i][sel.dataset.pi]=v; render(); return;
  }

  if(sel.id && sel.id.startsWith('file-import-')){
    const kind = sel.id.replace('file-import-','');
    const file = sel.files[0]; if(!file) return;
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    if(isExcel){
      reader.onload = async ()=>{
        try{
          const data = new Uint8Array(reader.result);
          const wb = XLSX.read(data, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false}).map(r=>r.map(c=>String(c)));
          await handleImportRows(kind, rows);
        }catch(err){ console.error(err); alert('Gagal membaca file Excel.'); }
        sel.value='';
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = async ()=>{ await handleImportRows(kind, csvParse(reader.result)); sel.value=''; };
      reader.readAsText(file);
    }
    return;
  }
  if(sel.id==='file-restore'){
    const file = sel.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const data = JSON.parse(reader.result);
        S.coa=data.coa||S.coa; S.journal=data.journal||S.journal; S.items=data.items||S.items; S.sales=data.sales||S.sales;
        S.purchases=data.purchases||S.purchases; S.assets=data.assets||S.assets; S.customers=data.customers||S.customers;
        S.vendors=data.vendors||S.vendors; S.meta=data.meta||S.meta;
        await saveAllKeys(); alert('Backup berhasil dipulihkan.'); render();
      }catch(err){ alert('File backup tidak valid.'); }
      sel.value='';
    };
    reader.readAsText(file); return;
  }
});
document.addEventListener('input', (e)=>{

  if(sel.dataset && sel.dataset.jl!==undefined){ const i=Number(sel.dataset.i); S.draft.journalLines[i][sel.dataset.jl]=sel.value; }

});

async function handleImportRows(kind, rows){
  if(!rows || !rows.length) return;
  const hasHeader = rows[0] && /kode|code|nama|name|tanggal|faktur/i.test(rows[0].join(''));
  const body = hasHeader ? rows.slice(1) : rows;
  if(kind==='coa'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.coa.some(a=>a.code===c[0])) return; S.coa.push({code:c[0],name:c[1]||c[0],type:c[2]||'BEBAN',kelompok:c[3]||'',saldoAwal:Number(c[4])||0}); n++; });
    await saveKey('coa',S.coa); alert('Berhasil impor '+n+' akun.');
  } else if(kind==='customers'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.customers.some(x=>x.kode===c[0])) return; S.customers.push({id:uid(),kode:c[0],nama:c[1]||c[0],alamat1:c[2]||'',alamat2:c[3]||'',kota:c[4]||'',kodepos:c[5]||'',telp1:c[6]||'',telp2:c[7]||'',fax:c[8]||'',npwp:c[9]||'',kontak:c[10]||'',keterangan:c[11]||'',termHari:Number(c[12])||0,saldoAwal:Number(c[13])||0}); n++; });
    await saveKey('customers',S.customers); alert('Berhasil impor '+n+' pelanggan.');
  } else if(kind==='vendors'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.vendors.some(x=>x.kode===c[0])) return; S.vendors.push({id:uid(),kode:c[0],nama:c[1]||c[0],alamat1:c[2]||'',alamat2:c[3]||'',kota:c[4]||'',kodepos:c[5]||'',telp1:c[6]||'',telp2:c[7]||'',fax:c[8]||'',npwp:c[9]||'',kontak:c[10]||'',keterangan:c[11]||'',termHari:Number(c[12])||0,saldoAwal:Number(c[13])||0}); n++; });
    await saveKey('vendors',S.vendors); alert('Berhasil impor '+n+' pemasok.');
  } else if(kind==='items'){
    let n=0; body.forEach(c=>{ if(!c[0]) return; if(S.items.some(x=>x.kode===c[0])) return; S.items.push({id:uid(),kode:c[0],nama:c[1]||c[0],satuan:c[2]||'pcs',akunPenjualan:c[3]||'4000',stok:Number(c[4])||0,hpp:Number(c[5])||0,hargaJual:Number(c[6])||0}); n++; });
    await saveKey('items',S.items); alert('Berhasil impor '+n+' barang.');
  } else if(kind==='penjualan'){
    await importSalesRows(body);
  } else if(kind==='pembelian'){
    await importPurchaseRows(body);
  } else if(kind==='saldoawal'){
    await importSaldoAwalRows(body);
  }
  render();
}

async function importSaldoAwalRows(rows){
  const cutoffEl = document.getElementById('saldoawal-cutoff');
  const hapusEl = document.getElementById('saldoawal-hapus-lain');
  const cutoff = (cutoffEl && cutoffEl.value) || todayISO();
  const hapusLain = !!(hapusEl && hapusEl.checked);
  if(isPeriodClosed(cutoff)){ alert('Tidak bisa posting: periode '+monthKey(cutoff)+' sudah ditutup buku.'); return; }
  S.meta.saldoAwalCutoff = cutoff; await saveKey('meta', S.meta);
  const importedCodes = new Set();
  let n=0, skipped=0;
  for(const r of rows){
    const code = (r[0]||'').trim();
    const saldoAwal = Number(r[1]);
    if(!code || isNaN(saldoAwal)) continue;
    importedCodes.add(code);
    const a = acc(code);
    if(!a){ skipped++; continue; }
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.refCode===code));
    await postSaldoAwalAkun(code, a.name, a.type, saldoAwal, cutoff);
    a.saldoAwal = saldoAwal;
    n++;
  }
  await saveKey('coa', S.coa);
  await saveKey('journal', S.journal);
  let deletedCount=0;
  if(hapusLain){
    const toKeep=[];
    for(const a of S.coa){
      if(importedCodes.has(a.code)){ toKeep.push(a); continue; }
      const dipakai = S.journal.some(e=> e.sumber!=='saldo-awal' && e.lines.some(l=>l.akun===a.code));
      if(dipakai){ toKeep.push(a); continue; }
      S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.refCode===a.code));
      deletedCount++;
    }
    S.coa = toKeep;
    await saveKey('coa', S.coa);
    await saveKey('journal', S.journal);
  }
  await logActivity('Import saldo awal akun ('+n+' akun, cutoff '+cutoff+')'+(hapusLain?', hapus '+deletedCount+' akun':''));
  alert('Import saldo awal selesai: '+n+' akun diperbarui'+(skipped?', '+skipped+' kode tidak ditemukan di COA (dilewati)':'')+(hapusLain?', '+deletedCount+' akun tidak terpakai dihapus':'')+'.');
}

async function importSalesRows(rows){
  const groups = {};
  rows.forEach(r=>{
    if(!r[0]) return;
    const key = r[0]+'|'+(r[2]||'');
    if(!groups[key]) groups[key] = {noFaktur:r[0], tanggal:r[1]||todayISO(), customerKode:r[2]||'', metode:r[3]||'Tunai', items:[]};
    groups[key].items.push({itemKode:r[4], qty:Number(r[5])||0, harga:Number(r[6])||0, diskon:Number(r[7])||0});
  });
  let n=0;
  for(const key in groups){
    const g = groups[key];
    const cust = S.customers.find(c=>c.kode===g.customerKode);
    const items = g.items.map(it=>{ const item=S.items.find(i=>i.kode===it.itemKode); return item? {itemId:item.id, itemNama:item.nama, qty:it.qty, harga:it.harga, diskon:it.diskon, nominal:Math.round(it.qty*it.harga*(1-it.diskon/100))} : null; }).filter(Boolean);
    if(!items.length) continue;
    const subtotal = items.reduce((s,it)=>s+it.nominal,0);
    const ppn = Math.round(subtotal*ppnRate());
    const total = subtotal+ppn;
    S.sales.push({id:uid(), tanggal:g.tanggal, noFaktur:g.noFaktur, customerId:cust?cust.id:'', customerNama:cust?cust.nama:'Umum', metode:g.metode, subtotal, ppn, total, dibayar:0, items, status:'pending', sumber:'penjualan'});
    n++;
  }
  await saveKey('sales', S.sales);
  alert('Berhasil impor '+n+' transaksi penjualan (status Pending, menunggu Otorisasi Penjualan).');
}

async function importPurchaseRows(rows){
  const groups = {};
  rows.forEach(r=>{
    if(!r[0]) return;
    const key = r[0]+'|'+(r[2]||'');
    if(!groups[key]) groups[key] = {noFaktur:r[0], tanggal:r[1]||todayISO(), vendorKode:r[2]||'', metode:r[3]||'Tunai', items:[]};
    groups[key].items.push({itemKode:r[4], qty:Number(r[5])||0, harga:Number(r[6])||0});
  });
  let n=0;
  for(const key in groups){
    const g = groups[key];
    const vend = S.vendors.find(v=>v.kode===g.vendorKode);
    const lineItems=[]; let subtotal=0;
    for(const it of g.items){
      const item = S.items.find(i=>i.kode===it.itemKode); if(!item) continue;
      await stockIn(item.id, it.qty, it.harga);
      lineItems.push({itemId:item.id, itemNama:item.nama, qty:it.qty, harga:it.harga});
      subtotal += it.qty*it.harga;
    }
    if(!lineItems.length) continue;
    const ppn = Math.round(subtotal*ppnRate()); const total = subtotal+ppn;
    const akunLawan = g.metode==='Tunai'?'1000':g.metode==='Transfer'?'1010':'2000';
    await postJournal({tanggal:g.tanggal, keterangan:'Pembelian '+g.noFaktur+' - '+(vend?vend.nama:'Umum')+' (impor)', sumber:'pembelian', vendorId:vend?vend.id:'', lines:[{akun:'1200',debit:subtotal,credit:0},{akun:'1300',debit:ppn,credit:0},{akun:akunLawan,debit:0,credit:total}]});
    S.purchases.push({id:uid(), tanggal:g.tanggal, noFaktur:g.noFaktur, vendorId:vend?vend.id:'', vendorNama:vend?vend.nama:'Umum', metode:g.metode, subtotal, ppn, total, dibayar: g.metode==='Hutang'?0:total, items:lineItems, sumber:'pembelian'});
    n++;
  }
  await saveKey('purchases', S.purchases);
  alert('Berhasil impor '+n+' transaksi pembelian.');
}

      const it = findItem(l.itemId);
      const nominal = Math.round(l.qty*l.harga*(1-(l.diskon||0)/100));
      return {itemId:l.itemId,itemNama:it?it.nama:'',qty:l.qty,harga:l.harga,diskon:l.diskon||0,nominal,noBatch:l.noBatch||'',tglEd:l.tglEd||''};
    });
    S.sales.push({id:uid(),tanggal:fd.get('tanggal'),noFaktur,customerId,customerNama:customerId?custName(customerId):'Umum',metode,subtotal,ppn,total,dibayar:0,items:lineItems,sumber:'penjualan',status:'pending'});
    await saveKey('sales',S.sales);
    S.draft.saleItems=null; render(); return;
  }
  if(form.id==='form-bayar-piutang'){
    const customerId=fd.get('customerId'), invoiceId=fd.get('invoiceId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah'));
    if(!invoiceId){ alert('Tidak ada invoice terbuka untuk pelanggan ini.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const inv = S.sales.find(s=>s.id===invoiceId); if(!inv){ alert('Invoice tidak ditemukan.'); return; }
    let akunSumber = akunKas;
    if(akunKas.startsWith('dp:')){
      const dp = S.dpReceived.find(d=>d.id===akunKas.slice(3));
      if(!dp || (dp.jumlah-dp.terpakai) < jumlah-0.5){ alert('Sisa uang muka tidak mencukupi.'); return; }
      dp.terpakai += jumlah; await saveKey('dp-received',S.dpReceived);
      akunSumber = '2106';
    }
    inv.dibayar = Math.min(inv.total, inv.dibayar+jumlah);
    await saveKey('sales',S.sales);
    await postJournal({tanggal,keterangan:'Penerimaan piutang '+inv.noFaktur+' - '+inv.customerNama,sumber:'pembayaran-piutang',customerId,invoiceId,lines:[{akun:akunSumber,debit:jumlah,credit:0},{akun:'1100',debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-bayar-hutang'){
    const vendorId=fd.get('vendorId'), invoiceId=fd.get('invoiceId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah'));
    if(!invoiceId){ alert('Tidak ada invoice terbuka untuk pemasok ini.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const po = S.purchases.find(p=>p.id===invoiceId); if(!po){ alert('Invoice tidak ditemukan.'); return; }
    let akunSumber = akunKas;
    if(akunKas.startsWith('dp:')){
      const dp = S.dpPaid.find(d=>d.id===akunKas.slice(3));
      if(!dp || (dp.jumlah-dp.terpakai) < jumlah-0.5){ alert('Sisa uang muka tidak mencukupi.'); return; }
      dp.terpakai += jumlah; await saveKey('dp-paid',S.dpPaid);
      akunSumber = '1103';
    }
    po.dibayar = Math.min(po.total, po.dibayar+jumlah);
    await saveKey('purchases',S.purchases);
    await postJournal({tanggal,keterangan:'Pembayaran hutang '+po.noFaktur+' - '+po.vendorNama,sumber:'pembayaran-hutang',vendorId,invoiceId,lines:[{akun:'2000',debit:jumlah,credit:0},{akun:akunSumber,debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-dp-terima'){
    const customerId=fd.get('customerId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah')), keterangan=fd.get('keterangan')||'';
    if(!customerId||!jumlah){ alert('Lengkapi pelanggan dan jumlah.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const dp = {id:uid(), tanggal, customerId, jumlah, terpakai:0, keterangan};
    S.dpReceived.push(dp); await saveKey('dp-received', S.dpReceived);
    await postJournal({tanggal, keterangan:'Terima uang muka penjualan - '+custName(customerId)+(keterangan?' ('+keterangan+')':''), sumber:'dp-penjualan', customerId, lines:[{akun:akunKas,debit:jumlah,credit:0},{akun:'2106',debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-dp-bayar'){
    const vendorId=fd.get('vendorId'), tanggal=fd.get('tanggal'), akunKas=fd.get('akunKas'), jumlah=Number(fd.get('jumlah')), keterangan=fd.get('keterangan')||'';
    if(!vendorId||!jumlah){ alert('Lengkapi pemasok dan jumlah.'); return; }
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const dp = {id:uid(), tanggal, vendorId, jumlah, terpakai:0, keterangan};
    S.dpPaid.push(dp); await saveKey('dp-paid', S.dpPaid);
    await postJournal({tanggal, keterangan:'Bayar uang muka pembelian - '+vendName(vendorId)+(keterangan?' ('+keterangan+')':''), sumber:'dp-pembelian', vendorId, lines:[{akun:'1103',debit:jumlah,credit:0},{akun:akunKas,debit:0,credit:jumlah}]});
    render(); return;
  }
  if(form.id==='form-retur-penjualan'){
    const invoiceId=fd.get('invoiceId'), lineIndex=Number(fd.get('lineIndex')), tanggal=fd.get('tanggal'), qtyRetur=Number(fd.get('qty'));
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const sale = S.sales.find(s=>s.id===invoiceId); if(!sale){ alert('Pilih invoice.'); return; }
    const line = sale.items[lineIndex]; if(!line){ alert('Pilih barang.'); return; }
    const sisaQty = line.qty-(line.qtyRetur||0);
    if(!qtyRetur || qtyRetur<=0 || qtyRetur>sisaQty){ alert('Qty retur tidak valid (maks '+sisaQty+').'); return; }
    const nominalRetur = Math.round(line.nominal/line.qty*qtyRetur);
    const ppnRetur = Math.round(nominalRetur*ppnRate());
    const costRetur = Math.round((line.hppTotal||0)/line.qty*qtyRetur);
    const item = findItem(line.itemId);
    const akunRetur = '4103';
    const akunKasLawan = sale.metode==='Tunai'?'1000':sale.metode==='Transfer'?'1010':'1100';
    await stockIn(line.itemId, qtyRetur, costRetur/qtyRetur);
    await postJournal({tanggal, keterangan:'Retur penjualan '+sale.noFaktur+' - '+(item?item.nama:'')+' x'+qtyRetur, sumber:'retur-penjualan', customerId:sale.customerId, invoiceId:sale.id,
      lines:[{akun:akunRetur,debit:nominalRetur,credit:0},{akun:'2100',debit:ppnRetur,credit:0},{akun:akunKasLawan,debit:0,credit:nominalRetur+ppnRetur},{akun:'1200',debit:costRetur,credit:0},{akun:'5000',debit:0,credit:costRetur}]});
    line.qtyRetur = (line.qtyRetur||0)+qtyRetur;
    sale.subtotal -= nominalRetur; sale.ppn -= ppnRetur; sale.total -= (nominalRetur+ppnRetur);
    sale.dibayar = Math.min(sale.dibayar, sale.total);
    await saveKey('sales', S.sales);
    S.returs.push({id:uid(), tipe:'penjualan', tanggal, noFaktur:sale.noFaktur, refId:sale.id, itemId:line.itemId, itemNama:item?item.nama:'', qty:qtyRetur, nominal:nominalRetur, ppn:ppnRetur, total:nominalRetur+ppnRetur});
    await saveKey('returs', S.returs);
    render(); return;
  }
  if(form.id==='form-retur-pembelian'){
    const invoiceId=fd.get('invoiceId'), lineIndex=Number(fd.get('lineIndex')), tanggal=fd.get('tanggal'), qtyRetur=Number(fd.get('qty'));
    if(isPeriodClosed(tanggal)){ alert('Tidak bisa posting: periode '+monthKey(tanggal)+' sudah ditutup buku.'); return; }
    const po = S.purchases.find(p=>p.id===invoiceId); if(!po){ alert('Pilih invoice.'); return; }
    const line = po.items[lineIndex]; if(!line){ alert('Pilih barang.'); return; }
    const sisaQty = line.qty-(line.qtyRetur||0);
    if(!qtyRetur || qtyRetur<=0 || qtyRetur>sisaQty){ alert('Qty retur tidak valid (maks '+sisaQty+').'); return; }
    const nominalRetur = Math.round((line.nominal!=null? line.nominal/line.qty : line.harga)*qtyRetur);
    const ppnRetur = Math.round(nominalRetur*ppnRate());
    const item = findItem(line.itemId);
    const akunLawan = po.metode==='Tunai'?'1000':po.metode==='Transfer'?'1010':'2000';
    await stockReverseOut(line.itemId, qtyRetur, nominalRetur);
    await postJournal({tanggal, keterangan:'Retur pembelian '+po.noFaktur+' - '+(item?item.nama:'')+' x'+qtyRetur, sumber:'retur-pembelian', vendorId:po.vendorId, invoiceId:po.id,
      lines:[{akun:akunLawan,debit:nominalRetur+ppnRetur,credit:0},{akun:'1200',debit:0,credit:nominalRetur},{akun:'1300',debit:0,credit:ppnRetur}]});
    line.qtyRetur = (line.qtyRetur||0)+qtyRetur;
    po.subtotal -= nominalRetur; po.ppn -= ppnRetur; po.total -= (nominalRetur+ppnRetur);
    po.dibayar = Math.min(po.dibayar, po.total);
    await saveKey('purchases', S.purchases);
    S.returs.push({id:uid(), tipe:'pembelian', tanggal, noFaktur:po.noFaktur, refId:po.id, itemId:line.itemId, itemNama:item?item.nama:'', qty:qtyRetur, nominal:nominalRetur, ppn:ppnRetur, total:nominalRetur+ppnRetur});
    await saveKey('returs', S.returs);
    render(); return;
  }
});
</script>
