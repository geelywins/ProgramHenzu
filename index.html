<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0f1c30; --navy-2:#18294a; --navy-3:#213a63; --teal:#12967e; --teal-dark:#0d7a66; --teal-light:#e4f5f1;
    --bg:#eef1f4; --panel:#ffffff; --ink:#141c26; --sub:#647084; --line:#e2e6ec;
    --amber:#c9822f; --red:#c0442f; --green:#2f8a5b; --greenbg:#e8f6ee; --redbg:#fbebe8; --amberbg:#fbf2e2;
    --shadow: 0 1px 2px rgba(15,28,48,.04), 0 4px 14px rgba(15,28,48,.05);
    --shadow-hover: 0 2px 6px rgba(15,28,48,.06), 0 10px 24px rgba(15,28,48,.09);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}
  input,select,textarea,button{font-family:inherit;font-size:14px;}
  #shell{display:flex;min-height:100vh;}
  #sidebar{width:240px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#cfd8e6;flex-shrink:0;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  #sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:#33456b;border-radius:4px;}
  #sidebar .brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  #sidebar .brand .logo{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
  #sidebar .brand .logo svg{width:100%;height:100%;}
  .topbar-logo{width:32px;height:32px;flex-shrink:0;}
  .topbar-logo svg{width:100%;height:100%;}
  #sidebar .brand b{color:#fff;font-size:15px;display:block;font-weight:700;letter-spacing:-.01em;}
  #sidebar .brand span{font-size:11px;color:#8296b8;}
  .navgroup{margin:14px 0 4px;padding:0 20px;font-size:10.5px;letter-spacing:.06em;color:#7086ac;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;font-weight:700;text-transform:uppercase;}
  .navgroup:hover{color:#fff;}
  .navgroup .chev{font-size:9px;transition:transform .18s ease;opacity:.7;}
  .navgroup.collapsed .chev{transform:rotate(-90deg);}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:#b7c3da;border-left:3px solid transparent;font-size:13.5px;transition:background .12s ease,color .12s ease;}
  .navitem .ic{font-size:14px;width:16px;text-align:center;flex-shrink:0;opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
  .navitem.active{background:rgba(18,150,126,.18);border-left-color:var(--teal);color:#fff;font-weight:600;}
  #main{flex:1;min-width:0;}
  #topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50;}
  #topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;}
  #topbar .meta{font-size:12.5px;color:var(--sub);}
  .hdrmenus{display:flex;gap:8px;}
  .hdrmenu{position:relative;}
  .hdrmenu-btn{background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:5px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:5px;}
  .hdrmenu-btn:hover{background:#eef0ef;}
  .hdrmenu-list{position:absolute;right:0;top:115%;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:220px;z-index:80;overflow:hidden;}
  .hdrmenu-item{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);}
  .hdrmenu-item:hover{background:#f0f2f1;}
  .hdrmenu-sep{height:1px;background:var(--line);margin:4px 0;}
  #content{padding:24px 28px 64px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);transition:box-shadow .15s ease;}
  .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .cardhead h2{font-size:15px;margin:0;font-weight:700;letter-spacing:-.005em;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:900px){.grid4{grid-template-columns:repeat(2,1fr);}.grid3,.grid2{grid-template-columns:1fr;}.hdrmenus{flex-wrap:wrap;}}
  .card{overflow-x:auto;}
  .hamburger-btn{display:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;}
  #sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:90;}
  @media (max-width:860px){
    .hamburger-btn{display:flex;}
    #sidebar{position:fixed;left:0;top:0;height:100vh;z-index:100;width:270px;max-width:82vw;transform:translateX(-105%);transition:transform .22s ease;box-shadow:10px 0 30px rgba(0,0,0,.25);}
    #shell.sidebar-open #sidebar{transform:translateX(0);}
    #shell.sidebar-open #sidebar-backdrop{display:block;}
    #main{width:100%;}
    #topbar{padding:12px 16px;}
    #content{padding:16px 14px 50px;}
    .grid4,.grid3,.grid2{grid-template-columns:1fr;}
    .row{flex-direction:column;align-items:stretch;}
    .lines-table{min-width:640px;}
    table{min-width:560px;}
    .tilegrid{grid-template-columns:repeat(2,1fr) !important;}
    #topbar h1{font-size:15.5px;}
    .card{padding:14px;border-radius:8px;}
  }
  @media (max-width:420px){
    .tilegrid{grid-template-columns:1fr !important;}
    #sidebar{width:250px;}
  }
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px;box-shadow:var(--shadow);}
  .stat .lbl{font-size:11.5px;color:var(--sub);margin-bottom:7px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .stat .val{font-size:20px;font-weight:800;letter-spacing:-.01em;}
  .stat .val.neg{color:var(--red);}
  .stat .val.pos{color:var(--green);}
  th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:13.3px;}
  th{background:#f5f7f9;font-size:11.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  tr:hover td{background:#f9fbfc;}
  td.num,th.num{text-align:right;}
  .btn{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink);font-weight:600;transition:all .12s ease;}
  .btn:hover{background:#eef0ef;transform:translateY(-1px);}
  .btn-primary{background:var(--teal);color:#fff;border-color:var(--teal-dark);box-shadow:0 2px 8px rgba(18,150,126,.28);}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-danger{color:var(--red);border-color:var(--red);}
  .btn-danger:hover{background:var(--redbg);}
  .btn-sm{padding:4px 9px;font-size:12px;}
  label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;}
  .field{margin-bottom:12px;}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);}
  textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:100px;}
  .row{display:flex;gap:10px;align-items:flex-end;}
  .row > *{flex:1;}
  .lines-table input,.lines-table select{padding:5px 7px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge-ok{background:var(--greenbg);color:var(--green);}
  .badge-warn{background:var(--amberbg);color:var(--amber);}
  .badge-bad{background:var(--redbg);color:var(--red);}
  .badge-muted{background:#eef0ef;color:var(--sub);}
  .tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .tabbtn{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--sub);border-bottom:2px solid transparent;}
  .tabbtn.active{color:var(--teal-dark);border-bottom-color:var(--teal);font-weight:600;}
  .empty{padding:26px;text-align:center;color:var(--sub);font-size:13px;}
  .note{font-size:12px;color:var(--sub);background:#f0f2f1;border-radius:5px;padding:9px 12px;margin-bottom:14px;}
  .hint{font-size:11.5px;color:var(--sub);margin-top:3px;}
  a.linklike{color:var(--teal-dark);cursor:pointer;text-decoration:underline;}
  .totalrow td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;}
  .grp-h{background:#e7ebe9;font-weight:700;}
  .tilegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px 12px;text-align:center;cursor:pointer;transition:box-shadow .15s, transform .15s, border-color .15s;}
  .tile:hover{box-shadow:0 6px 16px rgba(0,0,0,.08);transform:translateY(-2px);border-color:var(--teal);}
  .tile-icon{font-size:30px;margin-bottom:10px;line-height:1;}
  .tile-label{font-size:12.5px;color:var(--ink);font-weight:600;}
  @media (max-width:900px){.tilegrid{grid-template-columns:repeat(2,1fr);}}
  .grp-h2{background:#f2f4f3;font-style:italic;color:var(--sub);}
  .indent1{padding-left:22px !important;}
  .btn-pdf{background:#fff;border:1px solid var(--red);color:var(--red);}
  .btn-pdf:hover{background:var(--redbg);}
  .btn-xls{background:#fff;border:1px solid var(--green);color:var(--green);}
  .btn-xls:hover{background:var(--greenbg);}
  .btn-imp{background:#fff;border:1px solid var(--amber);color:var(--amber);}
  .btn-imp:hover{background:var(--amberbg);}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#c7cdcc;border-radius:5px;}
  @media print{ #sidebar,#topbar{display:none;} #content{padding:0;} .card{border:none;box-shadow:none;} .btn,.tabs,form{display:none !important;} }
  #login-screen{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,var(--teal-dark) 130%);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .login-box{background:#fff;border-radius:14px;padding:34px 32px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;}
  .login-logo{width:76px;height:76px;margin:0 auto 14px;}
  .login-logo svg{width:100%;height:100%;}
  .login-box h2{font-size:16px;margin:0 0 20px;color:var(--ink);}
  .login-box .field{text-align:left;}
  .login-error{color:var(--red);font-size:12.5px;min-height:16px;margin:4px 0;}
  .login-hint{font-size:11.5px;color:var(--sub);margin-top:14px;line-height:1.5;}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" id="loginLogo"></div>
    <h2 id="login-title">Masuk ke Program Akuntansi</h2>
    <form id="form-login">
      <div class="field"><label>Username</label><input type="text" name="username" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
      <div id="login-error" class="login-error"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px;">Masuk</button>
    </form>
  </div>
</div>
<div id="shell" style="display:none;">
  <div id="sidebar-backdrop" data-action="closeSidebar"></div>
  <div id="sidebar">
    <div class="brand"><div class="logo" id="brandLogo"></div><div><b id="brandName">Perusahaan</b><span>Program Akuntansi</span></div></div>
    <div id="navlist"></div>
  </div>
  <div id="main">
    <div id="topbar"></div>
    <div id="content"><div class="empty">Memuat data…</div></div>
  </div>
</div>

  superadmin: null, // null = semua tab diizinkan

};
async function hashPassword(pw){
  try{
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'plain:'+pw; } // fallback kalau crypto.subtle tak tersedia (mis. konteks non-HTTPS)
}
function hasPermission(action){
  if(!currentUser) return false;
  if(currentUser.role==='superadmin') return true;
  const adminAllowed = ['viewAllReports','inputTransaksi','editMasterData'];
  const pembelianAllowed = ['inputPembelian','tambahSupplier','exportOnly'];
  if(currentUser.role==='admin') return adminAllowed.includes(action);
  if(currentUser.role==='pembelian') return pembelianAllowed.includes(action);
  return false;
}
const SUPERADMIN_ONLY_TABS = ['setup-users','perbandingan'];
function tabAllowed(tab, role){
  if(SUPERADMIN_ONLY_TABS.includes(tab)) return role==='superadmin';
  const list = ALLOWED_TABS[role];
  if(list===null || list===undefined) return true;
  return list.includes(tab);
}

async function loadKey(key, fallback){
  try{ const r = await window.storage.get(key, false); if(!r || r.value===undefined) return fallback; return JSON.parse(r.value); }
  catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ console.error('Gagal menyimpan', key, e); }
}

/* ============================= UTIL ============================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtRp(n){ n=Math.round(n||0); const neg=n<0; n=Math.abs(n); return (neg?'-':'')+'Rp'+n.toLocaleString('id-ID'); }
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function terbilang(n){
  n = Math.round(Math.abs(n||0));
  const satuan = ['','SATU','DUA','TIGA','EMPAT','LIMA','ENAM','TUJUH','DELAPAN','SEMBILAN','SEPULUH','SEBELAS'];
  function eja(x){
    x = Math.floor(x);
    if(x < 12) return satuan[x];
    if(x < 20) return eja(x-10)+' BELAS';
    if(x < 100) return eja(Math.floor(x/10))+' PULUH'+(x%10?' '+eja(x%10):'');
    if(x < 200) return 'SERATUS'+(x%100?' '+eja(x%100):'');
    if(x < 1000) return eja(Math.floor(x/100))+' RATUS'+(x%100?' '+eja(x%100):'');
    if(x < 2000) return 'SERIBU'+(x%1000?' '+eja(x%1000):'');
    if(x < 1000000) return eja(Math.floor(x/1000))+' RIBU'+(x%1000?' '+eja(x%1000):'');
    if(x < 1000000000) return eja(Math.floor(x/1000000))+' JUTA'+(x%1000000?' '+eja(x%1000000):'');
    if(x < 1000000000000) return eja(Math.floor(x/1000000000))+' MILYAR'+(x%1000000000?' '+eja(x%1000000000):'');
    return eja(Math.floor(x/1000000000000))+' TRILIUN'+(x%1000000000000?' '+eja(x%1000000000000):'');
  }
  if(n===0) return 'NOL RUPIAH';
  return (eja(n)+' RUPIAH').replace(/\s+/g,' ').trim();
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function acc(code){ return S.coa.find(a=>a.code===code); }
function monthKey(d){ return (d||todayISO()).slice(0,7); }
function ppnRate(){ return (Number(S.meta.ppnRate)||11)/100; }
function download(filename, text){
  const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvParse(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const sep = line.includes('\t') ? '\t' : ',';
    return line.split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
  });
}

/* ============================= JOURNAL ENGINE ============================= */
async function postJournal(entry){
  entry.id = entry.id || uid();
  entry.no = entry.no || ('JU-'+String(S.journal.length+1).padStart(5,'0'));
  S.journal.push(entry);
  await saveKey('journal', S.journal);
  return entry;
}
function linesForAccount(code, start, end){
  const out=[];
  S.journal.forEach(e=>{
    if(start && e.tanggal<start) return; if(end && e.tanggal>end) return;
    e.lines.forEach(l=>{ if(l.akun===code) out.push({date:e.tanggal, no:e.no, ket:e.keterangan, sumber:e.sumber, debit:l.debit||0, credit:l.credit||0}); });
  });
  out.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return out;
}
function saldoAkun(code, upTo, from){
  const a = acc(code); if(!a) return 0;
  let d=0,c=0;
  S.journal.forEach(e=>{ if(upTo && e.tanggal>upTo) return; if(from && e.tanggal<from) return; e.lines.forEach(l=>{ if(l.akun===code){ d+=l.debit||0; c+=l.credit||0; } }); });
  return NORMAL_DEBIT[a.type] ? (d-c) : (c-d);
}
function totalDebitCredit(code, start, end){
  let d=0,c=0;
  S.journal.forEach(e=>{ if(start && e.tanggal<start) return; if(end && e.tanggal>end) return; e.lines.forEach(l=>{ if(l.akun===code){ d+=l.debit||0; c+=l.credit||0; } }); });
  return {d,c};
}
function journalBalanced(lines){
  const d = lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const c = lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  return Math.abs(d-c) < 1;
}

/* ============================= INVENTORY ============================= */
function findItem(id){ return S.items.find(i=>i.id===id); }
function stockValue(){ return S.items.reduce((s,i)=>s+i.stok*i.hpp,0); }
async function stockIn(itemId, qty, unitCost){
  const it = findItem(itemId); if(!it) return;
  const totalLama=it.stok*it.hpp, totalBaru=qty*unitCost;
  it.stok += qty;
  it.hpp = it.stok>0 ? (totalLama+totalBaru)/it.stok : unitCost;
  await saveKey('items', S.items);
}
async function stockOut(itemId, qty){
  const it = findItem(itemId); if(!it) return 0;
  const hpp = it.hpp;
  it.stok -= qty; if(it.stok<0) it.stok=0;
  await saveKey('items', S.items);
  return hpp*qty;
}
async function stockReverseOut(itemId, qty, value){
  // Menghapus qty dari stok dengan nilai spesifik (dipakai untuk retur pembelian, membalik seolah pembelian itu tak pernah terjadi)
  const it = findItem(itemId); if(!it) return;
  const totalValueBefore = it.stok*it.hpp;
  const totalValueAfter = Math.max(0, totalValueBefore - value);
  it.stok = Math.max(0, it.stok - qty);
  it.hpp = it.stok>0 ? totalValueAfter/it.stok : 0;
  await saveKey('items', S.items);
}
function nextPeriod(p){ let [y,m]=p.split('-').map(Number); m+=1; if(m>12){m=1;y+=1;} return y+'-'+String(m).padStart(2,'0'); }
function periodsCount(start,end){ const [sy,sm]=start.split('-').map(Number); const [ey,em]=end.split('-').map(Number); return (ey-sy)*12+(em-sm)+1; }
function agingBucket(days){ if(days<=0) return 'Belum Jatuh Tempo'; if(days<=30) return '1-30 Hari'; if(days<=60) return '31-60 Hari'; if(days<=90) return '61-90 Hari'; return '>90 Hari'; }
function effDate(sale){ return (sale && sale.tanggalOtorisasi) || (sale && sale.tanggal); }
function isPeriodClosed(dateStr){ return !!(S.meta.tutupBukuSampai && dateStr && monthKey(dateStr) <= S.meta.tutupBukuSampai); }
async function logActivity(desc){
  if(!S.activityLog) S.activityLog=[];
  S.activityLog.push({id:uid(), username:(currentUser?currentUser.username:'-'), nama:(currentUser?currentUser.nama:'-'), desc, waktu:new Date().toISOString()});
  if(S.activityLog.length>500) S.activityLog = S.activityLog.slice(-500);
  await saveKey('activity-log', S.activityLog);
}
async function postSaldoAwalAkun(code, name, type, saldoAwal, tanggal){
  if(!saldoAwal) return;
  tanggal = tanggal || todayISO();
  const isDebitNormal = NORMAL_DEBIT[type];
  const lines = isDebitNormal
    ? [{akun:code,debit:Math.max(saldoAwal,0),credit:Math.max(-saldoAwal,0)},{akun:'3900',debit:Math.max(-saldoAwal,0),credit:Math.max(saldoAwal,0)}]
    : [{akun:'3900',debit:Math.max(saldoAwal,0),credit:Math.max(-saldoAwal,0)},{akun:code,debit:Math.max(-saldoAwal,0),credit:Math.max(saldoAwal,0)}];
  await postJournal({tanggal,keterangan:'Saldo awal akun '+code+' - '+name,sumber:'saldo-awal',refCode:code,lines});
}

/* ============================= REPORT CALCS ============================= */
function accountsByType(type){ return S.coa.filter(a=>a.type===type); }
function labaRugi(start,end){
  const inRange=(d)=>(!start||d>=start)&&(!end||d<=end);
  function sumType(type){ let d=0,c=0; S.journal.forEach(e=>{ if(!inRange(e.tanggal)) return; e.lines.forEach(l=>{ const a=acc(l.akun); if(a&&a.type===type){ d+=l.debit||0; c+=l.credit||0; } }); }); return {d,c}; }
  const pend=sumType('PENDAPATAN'); const kontraPend=sumType('KONTRA_PENDAPATAN');
  const pendapatan=(pend.c-pend.d)-(kontraPend.d-kontraPend.c);
  const hppS=sumType('HPP'); const kontraHpp=sumType('KONTRA_HPP');
  const hpp=(hppS.d-hppS.c)-(kontraHpp.c-kontraHpp.d);
  const bebanS=sumType('BEBAN'); const beban=bebanS.d-bebanS.c;
  const labaKotor=pendapatan-hpp; const labaBersih=labaKotor-beban;
  const perAkun=(type)=>S.coa.filter(a=>a.type===type).map(a=>{
    let d=0,c=0; S.journal.forEach(e=>{ if(!inRange(e.tanggal)) return; e.lines.forEach(l=>{ if(l.akun===a.code){d+=l.debit||0;c+=l.credit||0;} }); });
    const bal = NORMAL_DEBIT[a.type]? d-c : c-d; return {...a, bal};
  }).filter(a=>a.bal!==0);
  return {pendapatan,hpp,beban,labaKotor,labaBersih,
    detailPendapatan:[...perAkun('PENDAPATAN'), ...perAkun('KONTRA_PENDAPATAN').map(a=>({...a,bal:-a.bal}))],
    detailHpp:[...perAkun('HPP'), ...perAkun('KONTRA_HPP').map(a=>({...a,bal:-a.bal}))],
    detailBeban:perAkun('BEBAN')};
}
function neraca(asOf){
  function bal(code){ return saldoAkun(code, asOf); }
  const aset = accountsByType('ASET').map(a=>({...a, bal:bal(a.code)}));
  const kontra = accountsByType('KONTRA_ASET').map(a=>({...a, bal:bal(a.code)}));
  const kewajiban = accountsByType('KEWAJIBAN').map(a=>({...a, bal:bal(a.code)}));
  const modal = accountsByType('MODAL').map(a=>({...a, bal:bal(a.code)}));
  const totalAset = aset.reduce((s,a)=>s+a.bal,0) - kontra.reduce((s,a)=>s+a.bal,0);
  const totalKewajiban = kewajiban.reduce((s,a)=>s+a.bal,0);
  const totalModalTercatat = modal.reduce((s,a)=>s+a.bal,0);
  const lr = labaRugi(null, asOf);
  const totalModal = totalModalTercatat + lr.labaBersih;
  return {aset,kontra,kewajiban,modal,totalAset,totalKewajiban,totalModal,labaBerjalan:lr.labaBersih};
}

/* ============================= SETUP: TUTUP BUKU ============================= */
function renderSetupTutupBuku(){
  const closedThrough = S.meta.tutupBukuSampai || null;
  const nextPeriodToClose = closedThrough ? nextPeriod(closedThrough) : (()=>{
    const dates = [...S.journal.map(e=>e.tanggal)].filter(Boolean).sort();
    return dates.length ? monthKey(dates[0]) : monthKey(todayISO());
  })();
  const todayPeriod = monthKey(todayISO());
  const canClose = nextPeriodToClose <= todayPeriod;
  const start = nextPeriodToClose+'-01';
  const endDate = new Date(Number(nextPeriodToClose.slice(0,4)), Number(nextPeriodToClose.slice(5,7)), 0).toISOString().slice(0,10);
  const end = endDate < todayISO() ? endDate : todayISO();
  const lr = labaRugi(start, end);
  const penjualanBulan = S.sales.filter(s=>s.status==='approved' && monthKey(effDate(s))===nextPeriodToClose).length;
  const pembelianBulan = S.purchases.filter(p=>monthKey(p.tanggal)===nextPeriodToClose).length;
  const kasMasuk = S.journal.filter(e=>monthKey(e.tanggal)===nextPeriodToClose).reduce((s,e)=>s+e.lines.filter(l=>l.akun==='1000'||l.akun==='1010').reduce((s2,l)=>s2+(l.debit||0),0),0);
  const kasKeluar = S.journal.filter(e=>monthKey(e.tanggal)===nextPeriodToClose).reduce((s,e)=>s+e.lines.filter(l=>l.akun==='1000'||l.akun==='1010').reduce((s2,l)=>s2+(l.credit||0),0),0);
  return `
  <div class="note">Tutup Buku mengunci semua transaksi pada bulan yang dipilih — setelah ditutup, tidak ada transaksi baru (penjualan, pembelian, kas/bank, jurnal, dll) yang bisa diposting dengan tanggal di bulan tersebut atau sebelumnya. Pastikan seluruh transaksi bulan itu sudah benar sebelum menutup.</div>
  <div class="card"><div class="cardhead"><h2>Status Tutup Buku</h2></div>
    <div class="grid2">
      <div class="stat"><div class="lbl">Sudah Ditutup Sampai</div><div class="val">${closedThrough? MONTH_NAMES[Number(closedThrough.slice(5,7))-1]+' '+closedThrough.slice(0,4) : 'Belum pernah tutup buku'}</div></div>
      <div class="stat"><div class="lbl">Periode Berjalan (Terbuka)</div><div class="val">${MONTH_NAMES[Number(todayPeriod.slice(5,7))-1]} ${todayPeriod.slice(0,4)}</div></div>
    </div>
  </div>
  <div class="card"><div class="cardhead"><h2>Rekap Periode ${MONTH_NAMES[Number(nextPeriodToClose.slice(5,7))-1]} ${nextPeriodToClose.slice(0,4)} (akan ditutup)</h2></div>
    <div class="grid4">
      <div class="stat"><div class="lbl">Transaksi Penjualan (Disetujui)</div><div class="val">${penjualanBulan}</div></div>
      <div class="stat"><div class="lbl">Transaksi Pembelian</div><div class="val">${pembelianBulan}</div></div>
      <div class="stat"><div class="lbl">Kas/Bank Masuk</div><div class="val pos">${fmtRp(kasMasuk)}</div></div>
      <div class="stat"><div class="lbl">Kas/Bank Keluar</div><div class="val neg">${fmtRp(kasKeluar)}</div></div>
    </div>
    <table><tbody>
      <tr><td>Pendapatan</td><td class="num">${fmtRp(lr.pendapatan)}</td></tr>
      <tr><td>Harga Pokok Penjualan</td><td class="num">${fmtRp(lr.hpp)}</td></tr>
      <tr><td>Laba Kotor</td><td class="num">${fmtRp(lr.labaKotor)}</td></tr>
      <tr><td>Beban Operasional</td><td class="num">${fmtRp(lr.beban)}</td></tr>
      <tr class="totalrow"><td>Laba/Rugi Bersih Bulan Ini</td><td class="num">${fmtRp(lr.labaBersih)}</td></tr>
    </tbody></table>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">

        <div class="field" style="flex:2"><label>Pemasok</label><select name="vendorId"><option value="">Umum</option>${vendorOptions}</select></div>
        <div class="field"><label>Metode Bayar</label><select name="metode"><option value="Tunai">Tunai (Kas)</option><option value="Transfer">Transfer (Bank)</option><option value="Hutang">Hutang</option></select></div>

      </div>

      <tbody>${linesHtml}</tbody>

}

    const historyRows = S.purchases.filter(p=>!vendSel || p.vendorId===vendSel).slice().reverse().slice(0,20)

/* ============================= LAPORAN: JURNAL TRANSAKSI ============================= */
function renderJurnal(){
  if(!S.draft.journalLines) S.draft.journalLines=[{akun:'',debit:'',credit:''},{akun:'',debit:'',credit:''}];
  const lines = S.draft.journalLines;
  const linesHtml = lines.map((l,i)=>`
    <tr>
      <td><select data-jl="akun" data-i="${i}"><option value="">Pilih akun…</option>${S.coa.map(a=>`<option value="${a.code}" ${l.akun===a.code?'selected':''}>${a.code} — ${esc(a.name)}</option>`).join('')}</select></td>
      <td><input type="number" data-jl="debit" data-i="${i}" value="${l.debit}" placeholder="0"></td>
      <td><input type="number" data-jl="credit" data-i="${i}" value="${l.credit}" placeholder="0"></td>
      <td><span class="linklike" data-action="removeJurnalLine" data-id="${i}">Hapus</span></td>
    </tr>`).join('');
  const totD = lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  const totC = lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  const rows = S.journal.slice().reverse().map(e=>{
    const d = e.lines.reduce((s,l)=>s+(l.debit||0),0);
    const detail = e.lines.map(l=>`${l.akun} ${l.debit?('D '+fmtRp(l.debit)):('K '+fmtRp(l.credit))}`).join(' • ');
    return `<tr><td>${fmtDate(e.tanggal)}</td><td>${esc(e.no)}</td><td>${esc(e.keterangan)}<div class="hint">${esc(detail)}</div></td><td><span class="badge badge-muted">${esc(e.sumber)}</span></td><td class="num">${fmtRp(d)}</td>
    <td>${e.sumber==='manual'?`<span class="linklike" data-action="deleteJurnal" data-id="${e.id}">Hapus</span>`:''}</td></tr>`;
  }).join('');
  return `
  <div class="note">Setiap transaksi yang diinput di modul Pembelian, Penjualan, Stock, Hutang Piutang, Kas/Bank, dan Biaya otomatis membentuk jurnal di sini.</div>
  <div class="card">
    <div class="cardhead"><h2>Input Jurnal Manual</h2></div>
    <form id="form-jurnal">
      <div class="row">
        <div class="field"><label>Tanggal</label><input type="date" name="tanggal" value="${todayISO()}" required></div>
        <div class="field" style="flex:3"><label>Keterangan</label><input type="text" name="keterangan" required placeholder="mis. Jurnal penyesuaian"></div>
      </div>
      <table class="lines-table"><thead><tr><th>Akun</th><th class="num">Debit</th><th class="num">Kredit</th><th></th></tr></thead>
      <tbody>${linesHtml}</tbody>
      <tfoot><tr class="totalrow"><td>Total</td><td class="num">${fmtRp(totD)}</td><td class="num">${fmtRp(totC)}</td><td></td></tr></tfoot></table>
      <div style="margin:10px 0;display:flex;gap:8px;">
        <button type="button" class="btn btn-sm" data-action="addJurnalLine">+ Tambah Baris</button>
        ${Math.abs(totD-totC)>=1 ? `<span class="badge badge-bad">Belum balance, selisih ${fmtRp(totD-totC)}</span>`:`<span class="badge badge-ok">Balance</span>`}
      </div>
      <button class="btn btn-primary" type="submit">Posting Jurnal</button>
    </form>
  </div>
  <div class="card"><div class="cardhead"><h2>Riwayat Jurnal (${S.journal.length})</h2>${toolbarHtml('jurnal')}</div>
    ${rows? `<table><thead><tr><th>Tanggal</th><th>No.</th><th>Keterangan</th><th>Sumber</th><th class="num">Total</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Belum ada jurnal.</div>`}
  </div>`;
}

/* ============================= LAPORAN: BUKU BESAR ============================= */
function renderBukuBesar(){
  const sel = S.draft.bbAkun || (S.coa[0]&&S.coa[0].code) || '';
  const a = acc(sel);
  const lines = sel? linesForAccount(sel):[];
  let running=0;
  const rows = lines.map(l=>{ running += NORMAL_DEBIT[a.type]? (l.debit-l.credit):(l.credit-l.debit); return `<tr><td>${fmtDate(l.date)}</td><td>${esc(l.no)}</td><td>${esc(l.ket)}</td><td class="num">${l.debit?fmtRp(l.debit):''}</td><td class="num">${l.credit?fmtRp(l.credit):''}</td><td class="num">${fmtRp(running)}</td></tr>`; }).join('');
  return `
  <div class="card"><div class="cardhead"><h2>Pilih Akun</h2></div>
    <select id="bb-select" style="max-width:340px">${S.coa.map(x=>`<option value="${x.code}" ${x.code===sel?'selected':''}>${x.code} — ${esc(x.name)}</option>`).join('')}</select>

  <div class="card">

  </div>`;
}

/* ============================= LAPORAN: BUKU BESAR PEMBANTU PIUTANG / HUTANG ============================= */
function renderBBPiutang(){
  const sel = S.draft.bbpCustomer || '';
  const summaryRows = S.customers.map(c=>{
    const inv = S.sales.filter(s=>s.customerId===c.id && s.status==='approved');
    const total = inv.reduce((s,x)=>s+x.total,0), dibayar = inv.reduce((s,x)=>s+x.dibayar,0);
    return `<tr><td>${esc(c.kode)} — ${esc(c.nama)}</td><td class="num">${fmtRp(total)}</td><td class="num">${fmtRp(dibayar)}</td><td class="num">${fmtRp(total-dibayar)}</td></tr>`;
  }).join('');
  let detail='';
  if(sel){
    const c = S.customers.find(x=>x.id===sel);
    const mutasi = [];
    S.sales.filter(s=>s.customerId===sel && s.status==='approved').forEach(s=> mutasi.push({date:effDate(s), ket:'Faktur '+s.noFaktur, debit:s.total, credit:0}));
    S.journal.filter(e=>e.sumber==='pembayaran-piutang' && e.customerId===sel).forEach(e=>{
      const cr = e.lines.find(l=>l.credit>0);
      mutasi.push({date:e.tanggal, ket:e.keterangan, debit:0, credit:cr?cr.credit:0});
    });
    mutasi.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    let running=0;
    const rows = mutasi.map(m=>{ running += m.debit-m.credit; return `<tr><td>${fmtDate(m.date)}</td><td>${esc(m.ket)}</td><td class="num">${m.debit?fmtRp(m.debit):''}</td><td class="num">${m.credit?fmtRp(m.credit):''}</td><td class="num">${fmtRp(running)}</td></tr>`; }).join('');
    detail = `<div class="card"><div class="cardhead"><h2>Mutasi — ${esc(c?c.nama:'')}</h2><span class="hint">Saldo: ${fmtRp(running)}</span></div>
      ${rows? `<table><thead><tr><th>Tanggal</th><th>Keterangan</th><th class="num">Debit</th><th class="num">Kredit</th><th class="num">Saldo</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">Belum ada mutasi.</div>`}</div>`;
  }
  return `
  <div class="card"><div class="cardhead"><h2>Ringkasan Piutang per Pelanggan</h2>${toolbarHtml('bukubesarpiutang')}</div>

    <select id="bbp-select"><option value="">Pilih pelanggan…</option>${S.customers.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>

}

/* ============================= LAPORAN: NERACA SALDO ============================= */
function renderNeracaSaldo(){
  const start = S.draft.nsStart||'', end = S.draft.nsEnd||todayISO();
  const rows = S.coa.map(a=>{
    const {d,c} = totalDebitCredit(a.code,start,end);
    const net = NORMAL_DEBIT[a.type]? d-c : c-d;
    const debCol = NORMAL_DEBIT[a.type]? Math.max(net,0):Math.max(-net,0);
    const credCol = NORMAL_DEBIT[a.type]? Math.max(-net,0):Math.max(net,0);
    return {a,debCol,credCol};
  }).filter(r=>r.debCol||r.credCol);
  const totD = rows.reduce((s,r)=>s+r.debCol,0), totC = rows.reduce((s,r)=>s+r.credCol,0);
  return `
  <div class="card"><div class="cardhead"><h2>Periode</h2>
    <div class="row" style="max-width:420px"><div class="field"><label>Dari</label><input type="date" id="ns-start" value="${start}"></div><div class="field"><label>Sampai</label><input type="date" id="ns-end" value="${end}"></div></div>

    <table><thead><tr><th>Kode</th><th>Nama Akun</th><th class="num">Debit</th><th class="num">Kredit</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.a.code)}</td><td>${esc(r.a.name)}</td><td class="num">${r.debCol?fmtRp(r.debCol):''}</td><td class="num">${r.credCol?fmtRp(r.credCol):''}</td></tr>`).join('')}
    <tr class="totalrow"><td colspan="2">Total</td><td class="num">${fmtRp(totD)}</td><td class="num">${fmtRp(totC)}</td></tr>

}

  function periodLR(m){ const start=y+'-'+String(m).padStart(2,'0')+'-01'; const end = new Date(y,m,0).toISOString().slice(0,10); const realEnd = end<today?end:today; return labaRugi(start,realEnd); }
  const rowsData = months.map(m=>({m, lr:periodLR(m)}));

/* ============================= LAPORAN: RINCIAN LAPORAN KEUANGAN (hierarkis, gaya Accurate) ============================= */
function rincianData(end){
  // Urutan & label kelompok besar mengikuti pola laporan Accurate: AKTIVA, AKTIVA TETAP, HUTANG, MODAL, PENDAPATAN, HPP, BEBAN
  const superGroups = [
    {label:'AKTIVA', types:['ASET','KONTRA_ASET']},
    {label:'HUTANG', types:['KEWAJIBAN']},
    {label:'MODAL', types:['MODAL']},
    {label:'PENDAPATAN', types:['PENDAPATAN','KONTRA_PENDAPATAN']},
    {label:'HARGA POKOK PENJUALAN', types:['HPP','KONTRA_HPP']},
    {label:'BEBAN', types:['BEBAN']},
  ];
  return superGroups.map(sg=>{
    const accs = S.coa.filter(a=>sg.types.includes(a.type));
    const byKelompok = {};
    accs.forEach(a=>{ const k=a.kelompok||'Lain-lain'; (byKelompok[k]=byKelompok[k]||[]).push(a); });
    const kelompokList = Object.keys(byKelompok).map(k=>{
      const rows = byKelompok[k].map(a=>({...a, bal:saldoAkun(a.code,end)})).filter(a=>a.bal!==0 || true);
      const subtotal = rows.reduce((s,a)=> s + ((a.type==='KONTRA_ASET'||a.type==='KONTRA_PENDAPATAN'||a.type==='KONTRA_HPP')? -a.bal : a.bal), 0);
      return {kelompok:k, rows, subtotal};
    });
    const superTotal = kelompokList.reduce((s,k)=>s+k.subtotal,0);
    return {...sg, kelompokList, superTotal};
  });
}
function renderRincian(){
  const end = S.draft.rincEnd || todayISO();
  const data = rincianData(end);
  const body = data.map(sg=>`
    <tr class="grp-h"><td colspan="2">${esc(sg.label)}</td><td class="num">${fmtRp(sg.superTotal)}</td></tr>
    ${sg.kelompokList.map(k=>`
      <tr class="grp-h2"><td colspan="2">&nbsp;&nbsp;${esc(k.kelompok)}</td><td class="num">${fmtRp(k.subtotal)}</td></tr>
      ${k.rows.map(a=>`<tr><td class="indent1">${esc(a.code)}</td><td>${esc(a.name)}</td><td class="num">${fmtRp(a.bal)}</td></tr>`).join('')}
    `).join('')}
  `).join('');
  return `
  <div class="note">Menyajikan seluruh akun aktif beserta saldonya per tanggal terpilih, dikelompokkan mengikuti struktur Rincian Laporan Keuangan (Aktiva Lancar, Aktiva Tetap, Hutang Usaha, dsb — sesuai field "Kelompok" pada Daftar Akun).</div>
  <div class="card"><div class="cardhead"><h2>Periode</h2>
    <div class="row" style="max-width:420px"><div class="field"><label>Sampai Tanggal</label><input type="date" id="rinc-end" value="${end}"></div><div class="field">${toolbarHtml('rincian')}</div></div>
  </div></div>
  <div class="card"><div class="cardhead"><h2>Rincian Laporan Keuangan per ${fmtDate(end)}</h2></div>
    <table><thead><tr><th>Kode</th><th>Nama Akun</th><th class="num">Saldo</th></tr></thead><tbody>${body}</tbody></table>
  </div>`;
}

/* ============================= LAPORAN: KARTU PIUTANG / HUTANG RINCIAN (open items / aging) ============================= */
function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+Number(days||0)); return d.toISOString().slice(0,10); }
function renderKartuRincian(mode){
  const isPiutang = mode==='piutang';
  const parties = isPiutang? S.customers : S.vendors;
  const docs = isPiutang? S.sales.filter(s=>s.status==='approved') : S.purchases;
  const today = todayISO();
  const bucketTotals = {'Belum Jatuh Tempo':0,'1-30 Hari':0,'31-60 Hari':0,'61-90 Hari':0,'>90 Hari':0};
  const sections = parties.map(p=>{
    const open = docs.filter(d=> (isPiutang? d.customerId : d.vendorId)===p.id && (d.total-d.dibayar)>0.5);
    if(!open.length) return '';
    const rows = open.map(d=>{
      const docDate = isPiutang? effDate(d) : d.tanggal;
      const jt = addDays(docDate, p.termHari||0);
      const overdue = Math.round((new Date(today)-new Date(jt))/86400000);
      const bucket = agingBucket(overdue);
      bucketTotals[bucket] += (d.total-d.dibayar);
      return `<tr><td>${esc(d.noFaktur)}</td><td>${fmtDate(docDate)}</td><td>${fmtDate(jt)}</td><td class="num">${fmtRp(d.total)}</td><td class="num">${fmtRp(d.dibayar)}</td><td class="num">${fmtRp(d.total-d.dibayar)}</td><td><span class="badge ${bucket==='Belum Jatuh Tempo'?'badge-muted':bucket==='1-30 Hari'?'badge-warn':'badge-bad'}">${bucket}</span></td></tr>`;
    }).join('');
    const subtotal = open.reduce((s,d)=>s+(d.total-d.dibayar),0);
    return `<div class="card"><div class="cardhead"><h2>${esc(p.kode)} — ${esc(p.nama)}</h2><span class="hint">Sisa: ${fmtRp(subtotal)}</span></div>
      <table><thead><tr><th>No.Faktur</th><th>Tgl Faktur</th><th>Tgl Jatuh Tempo</th><th class="num">Nilai</th><th class="num">Dibayar</th><th class="num">Sisa</th><th>Umur (Aging)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  const grandTotal = docs.reduce((s,d)=>s+(d.total-d.dibayar),0);
  return `
  <div class="note">Rincian saldo ${isPiutang?'piutang':'hutang'} per faktur yang masih terbuka (belum lunas), dikelompokkan menurut umur jatuh tempo (aging) — setara "Saldo ${isPiutang?'Piutang':'Hutang'} Rincian" pada Accurate.</div>
  <div class="grid4">
    ${Object.entries(bucketTotals).map(([b,v])=>`<div class="stat"><div class="lbl">${esc(b)}</div><div class="val">${fmtRp(v)}</div></div>`).join('')}
  </div>
  <div class="card"><div class="cardhead"><h2>Total Sisa ${isPiutang?'Piutang':'Hutang'}: ${fmtRp(grandTotal)}</h2>${toolbarHtml(isPiutang?'kartupiutang':'kartuhutang')}</div></div>
  ${sections || `<div class="empty">Tidak ada saldo ${isPiutang?'piutang':'hutang'} terbuka.</div>`}`;
}

/* ============================= LAPORAN: DAFTAR PELUNASAN PIUTANG / HUTANG ============================= */

  const rows = entries.map(e=>{
    const partyId = isPiutang? e.customerId : e.vendorId;
    const partyName = isPiutang? custName(partyId) : vendName(partyId);
    const inv = isPiutang? S.sales.find(s=>s.id===e.invoiceId) : S.purchases.find(p=>p.id===e.invoiceId);
    const amt = e.lines.reduce((s,l)=> s + (isPiutang? (l.debit||0) : (l.debit||0)), 0);

      <tr class="totalrow"><td colspan="6">Total</td><td class="num">${fmtRp(total)}</td></tr>

  }).join('');
  return `
  <div class="note">Transaksi penjualan baru diakui sebagai penjualan resmi (masuk jurnal, mengurangi stok, dan tampil di seluruh laporan) setelah diotorisasi di sini. Menolak transaksi akan membatalkannya secara permanen. ${isSuperadmin?'':'<b>Hanya Super Admin yang dapat melakukan otorisasi/penolakan.</b>'}</div>
  <div class="card"><div class="cardhead"><h2>Menunggu Otorisasi (${pending.length})</h2>${toolbarHtml('otorisasi')}</div>
    ${pendingRows? `<table><thead><tr><th>Tanggal</th><th>No.Faktur</th><th>Konsumen</th><th>Metode</th><th class="num">Grand Total</th><th>Aksi</th><th>Invoice</th></tr></thead><tbody>${pendingRows}</tbody></table>` : `<div class="empty">Tidak ada transaksi penjualan yang menunggu otorisasi.</div>`}
  </div>
  <div class="card"><div class="cardhead"><h2>Riwayat Otorisasi</h2></div>
    ${historyRows? `<table><thead><tr><th>Tanggal</th><th>No.Faktur</th><th>Konsumen</th><th class="num">Grand Total</th><th>Status</th><th>Oleh</th><th>Waktu</th><th>Invoice</th></tr></thead><tbody>${historyRows}</tbody></table>` : `<div class="empty">Belum ada riwayat.</div>`}
  </div>`;
}

function toolbarHtml(key, opts={}){
  const importKind = opts.importKind || key;
  const importBtn = opts.allowImport ? `<button type="button" class="btn btn-sm btn-imp" data-action="importCsv" data-id="${importKind}">Impor Excel/CSV</button>` : '';
  return `<div class="toolbar">${importBtn}<button type="button" class="btn btn-sm btn-xls" data-action="exportExcel" data-id="${key}">Ekspor Excel</button><button type="button" class="btn btn-sm btn-pdf" data-action="exportPdf" data-id="${key}">Unduh PDF</button></div>`;
}
function printInvoice(saleId, mode){
  mode = mode || 'download';
  const sale = S.sales.find(s=>s.id===saleId);
  if(!sale){ alert('Transaksi tidak ditemukan.'); return; }
  if(sale.status==='rejected'){ alert('Transaksi ini sudah ditolak dan tidak berlaku, invoice tidak bisa dicetak.'); return; }
  const isDraft = sale.status!=='approved';
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 40; let y = 46;
    const cust = S.customers.find(c=>c.id===sale.customerId);
    const term = cust? (cust.termHari||0) : 0;
    const tglInvoice = effDate(sale);
    const jatuhTempo = addDays(tglInvoice, term);

    // --- Logo bulat sederhana (inisial perusahaan) ---
    const namaPerusahaan = S.meta.nama || 'Nama Perusahaan';
    const initials = namaPerusahaan.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    doc.setDrawColor(28,42,82); doc.setLineWidth(1.1);
    doc.circle(margin+20, y+18, 22, 'S');
    doc.setFillColor(28,42,82); doc.circle(margin+20, y+18, 18, 'F');
    doc.setTextColor(255,255,255); doc.setFont(undefined,'bold'); doc.setFontSize(11);
    doc.text(initials, margin+20, y+22, {align:'center'});
    doc.setTextColor(0,0,0);

    const textX = margin+52;
    doc.setFont(undefined,'bold'); doc.setFontSize(15);
    doc.text(namaPerusahaan.toUpperCase(), textX, y+12);
    doc.setFontSize(17);
    doc.text(isDraft?'PROFORMA INVOICE':'INVOICE', pageW-margin, y+14, {align:'right'});
    y += 28;
    doc.setFont(undefined,'normal'); doc.setFontSize(8.5);
    if(S.meta.alamat){ doc.text(S.meta.alamat, textX, y); y+=11; }
    const kontak = S.meta.telp?('Telp/Fax : '+S.meta.telp):'';
    if(kontak){ doc.text(kontak, textX, y); }
    if(S.meta.npwp){ doc.text('NPWP : '+S.meta.npwp, pageW-margin, y, {align:'right'}); }
    y+=14;
    doc.setDrawColor(150); doc.setLineWidth(0.7); doc.line(margin, y, pageW-margin, y); y+=16;

    const labelX = pageW/2+10, valueX = pageW/2+75;
    doc.setFontSize(9);
    doc.text('Kepada Yth :', margin, y);
    doc.text('No. Faktur', labelX, y); doc.text(': '+sale.noFaktur, valueX, y);
    y+=13;
    doc.setFont(undefined,'bold'); doc.text(sale.customerNama||'Umum', margin, y); doc.setFont(undefined,'normal');
    doc.text('Tanggal', labelX, y); doc.text(': '+fmtDate(tglInvoice), valueX, y);
    y+=13;
    if(cust && cust.alamat1){ doc.text(cust.alamat1, margin, y); }
    doc.text('TOP', labelX, y); doc.text(': '+term+' Hari', valueX, y);
    y+=13;
    doc.text('Jatuh Tempo', labelX, y); doc.text(': '+fmtDate(jatuhTempo), valueX, y);
    y+=22;

    const head = ['No','Nama Barang','No.Batch/ED','Qty','Harga','Disc%','Nilai Disc','Jumlah'];
    const body = (sale.items||[]).map((it,idx)=>{
      const nilaiDisc = Math.round(it.qty*it.harga*(it.diskon||0)/100);
      return [String(idx+1), it.itemNama, (it.noBatch||'-')+(it.tglEd?(' / '+fmtDate(it.tglEd)):''), String(it.qty), fmtRp(it.harga), (it.diskon||0)+'%', fmtRp(nilaiDisc), fmtRp(it.nominal)];
    });
    doc.autoTable({
      startY:y, margin:{left:margin,right:margin},
      head:[head], body,
      styles:{fontSize:7.6, cellPadding:3.5},
      headStyles:{fillColor:[21,34,56], textColor:255},
      columnStyles:{0:{cellWidth:22,halign:'center'},3:{halign:'right',cellWidth:32},4:{halign:'right'},5:{halign:'right',cellWidth:32},6:{halign:'right'},7:{halign:'right'}}
    });
    y = doc.lastAutoTable.finalY + 16;

    if(y > 680){ doc.addPage(); y = 50; }

    const boxW = (pageW-2*margin)*0.55;
    doc.setDrawColor(0); doc.setLineWidth(0.8); doc.rect(margin, y, boxW, 40);
    doc.setFontSize(7.6);
    const terbilangText = terbilang(sale.total);
    const wrapped = doc.splitTextToSize(terbilangText, boxW-10);
    doc.text(wrapped, margin+5, y+13);

    const sumX = margin+boxW+20;
    doc.setFontSize(9);
    doc.text('Sub Total', sumX, y+10); doc.text(fmtRp(sale.subtotal), pageW-margin, y+10, {align:'right'});
    doc.text('PPN', sumX, y+24); doc.text(fmtRp(sale.ppn), pageW-margin, y+24, {align:'right'});
    doc.setFont(undefined,'bold');
    doc.text('Total Tagihan', sumX, y+38); doc.text(fmtRp(sale.total), pageW-margin, y+38, {align:'right'});
    doc.setFont(undefined,'normal');
    y += 62;

    doc.setFontSize(9);
    doc.text('Penerima', margin, y);
    doc.text('Penanggung Jawab', margin+180, y);
    y += 42;
    doc.text('(  Cap dan Ttd  )', margin, y);
    y += 18;

    if(S.meta.coldChain){
      const boxW2 = pageW-2*margin;
      doc.setLineWidth(0.8); doc.rect(margin, y, boxW2, 38);
      doc.setFontSize(8);
      doc.text('Serah Terima Produk Rantai Dingin 2 - 8°C', margin+boxW2/2, y+12, {align:'center'});
      doc.line(margin+boxW2/2, y+16, margin+boxW2/2, y+38);
      doc.text('Suhu Dikirim', margin+boxW2/4, y+29, {align:'center'});
      doc.text('Suhu Diterima', margin+boxW2*3/4, y+29, {align:'center'});
      y += 52;
    }

    doc.setFontSize(9);
    if(S.meta.rekBank){ doc.text('Pembayaran: '+S.meta.rekBank, pageW/2, y, {align:'center'}); y+=18; }
    if(S.meta.catatanInvoice){
      doc.setFont(undefined,'bold'); doc.setFontSize(9);
      const w2 = doc.getTextWidth(S.meta.catatanInvoice)+24;
      doc.rect(pageW/2-w2/2, y-11, w2, 18);
      doc.text(S.meta.catatanInvoice, pageW/2, y+2, {align:'center'});
      doc.setFont(undefined,'normal');
    }

    if(isDraft){
      doc.setTextColor(220,60,60); doc.setFontSize(46); doc.setFont(undefined,'bold');
      doc.text('DRAFT', pageW/2, 420, {align:'center', angle:35});
      doc.setTextColor(0,0,0);
    }

    if(mode==='print'){
      doc.autoPrint();
      const blobUrl = doc.output('bloburl');
      const w = window.open(blobUrl, '_blank');
      if(!w){ alert('Popup diblokir browser. Izinkan popup untuk situs ini agar bisa cetak langsung, atau gunakan tombol Unduh PDF.'); }
    } else {
      doc.save((isDraft?'Draft-':'Invoice-')+sale.noFaktur.replace(/\//g,'-')+'.pdf');
    }
  }catch(err){ console.error(err); alert('Gagal membuat invoice PDF. Coba lagi.'); }
}
function pdfTable(title, head, body, opts={}){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation: opts.landscape?'landscape':'portrait', unit:'pt', format:'a4'});
    doc.setFontSize(13); doc.text(title, 40, 40);
    doc.setFontSize(9); doc.setTextColor(90);
    doc.text((S.meta.nama||'')+(opts.subtitle?'  —  '+opts.subtitle:''), 40, 56);
    doc.autoTable({ head:[head], body, startY:66, styles:{fontSize:8, cellPadding:4}, headStyles:{fillColor:[21,34,56], textColor:255}, margin:{left:40,right:40} });
    doc.save((opts.filename||title.replace(/\s+/g,'_'))+'.pdf');
  }catch(err){ console.error(err); alert('Gagal membuat PDF (koneksi internet diperlukan untuk memuat pustaka PDF saat pertama kali). Coba lagi.'); }
}
function excelExport(filename, head, body){
  try{
    const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    XLSX.writeFile(wb, filename+'.xlsx');
  }catch(err){ console.error(err); alert('Gagal membuat Excel (koneksi internet diperlukan untuk memuat pustaka saat pertama kali). Coba lagi.'); }
}
function getExportData(key){
  const today = todayISO();
  if(key==='jurnal'){
    const body = S.journal.flatMap(e=>e.lines.map(l=>[fmtDate(e.tanggal), e.no, e.keterangan, l.akun, l.debit?fmtRp(l.debit):'', l.credit?fmtRp(l.credit):'']));
    return {title:'Jurnal Transaksi', head:['Tanggal','No.','Keterangan','Akun','Debit','Kredit'], body, opts:{filename:'jurnal-transaksi', landscape:true}};
  }
  if(key==='bukubesar'){
    const sel = S.draft.bbAkun || (S.coa[0]&&S.coa[0].code)||'';
    const a = acc(sel); const lines = sel? linesForAccount(sel):[]; let running=0;
    const body = lines.map(l=>{ running += NORMAL_DEBIT[a.type]? (l.debit-l.credit):(l.credit-l.debit); return [fmtDate(l.date), l.no, l.ket, l.debit?fmtRp(l.debit):'', l.credit?fmtRp(l.credit):'', fmtRp(running)]; });
    return {title:'Buku Besar - '+(a?a.code+' '+a.name:''), head:['Tanggal','No.Jurnal','Keterangan','Debit','Kredit','Saldo'], body, opts:{filename:'buku-besar-'+sel}};
  }
  if(key==='bukubesarpiutang'){
    const body = S.customers.map(c=>{ const inv=S.sales.filter(s=>s.customerId===c.id && s.status==='approved'); const total=inv.reduce((s,x)=>s+x.total,0), dibayar=inv.reduce((s,x)=>s+x.dibayar,0); return [c.kode, c.nama, fmtRp(total), fmtRp(dibayar), fmtRp(total-dibayar)]; });
    return {title:'Buku Besar Pembantu Piutang', head:['Kode','Nama','Total Tagihan','Dibayar','Sisa'], body, opts:{filename:'buku-besar-piutang'}};
  }
  if(key==='bukubesarhutang'){
    const body = S.vendors.map(v=>{ const po=S.purchases.filter(p=>p.vendorId===v.id); const total=po.reduce((s,x)=>s+x.total,0), dibayar=po.reduce((s,x)=>s+x.dibayar,0); return [v.kode, v.nama, fmtRp(total), fmtRp(dibayar), fmtRp(total-dibayar)]; });
    return {title:'Buku Besar Pembantu Hutang', head:['Kode','Nama','Total Tagihan','Dibayar','Sisa'], body, opts:{filename:'buku-besar-hutang'}};
  }
  if(key==='neracasaldo'){
    const start=S.draft.nsStart||'', end=S.draft.nsEnd||today;
    const rows = S.coa.map(a=>{ const {d,c}=totalDebitCredit(a.code,start,end); const net=NORMAL_DEBIT[a.type]?d-c:c-d; const debCol=NORMAL_DEBIT[a.type]?Math.max(net,0):Math.max(-net,0); const credCol=NORMAL_DEBIT[a.type]?Math.max(-net,0):Math.max(net,0); return {a,debCol,credCol}; }).filter(r=>r.debCol||r.credCol);
    const body = rows.map(r=>[r.a.code, r.a.name, r.debCol?fmtRp(r.debCol):'', r.credCol?fmtRp(r.credCol):'']);
    return {title:'Neraca Saldo', head:['Kode','Nama Akun','Debit','Kredit'], body, opts:{filename:'neraca-saldo'}};
  }
  if(key==='neracabulan' || key==='neracaakhir'){
    const asOf = key==='neracabulan'? today : (()=>{ const y=S.draft.naTahun||new Date().getFullYear(); const yEnd=y+'-12-31'; return yEnd<today?yEnd:today; })();
    const n = neraca(asOf);
    const body = [];
    body.push(['AKTIVA','','']);
    n.aset.forEach(a=>body.push([a.code, a.name, fmtRp(a.bal)]));
    n.kontra.forEach(a=>body.push([a.code, '(-) '+a.name, fmtRp(-a.bal)]));
    body.push(['','Total Aset', fmtRp(n.totalAset)]);
    body.push(['KEWAJIBAN','','']);
    n.kewajiban.forEach(a=>body.push([a.code, a.name, fmtRp(a.bal)]));
    body.push(['','Total Kewajiban', fmtRp(n.totalKewajiban)]);
    body.push(['MODAL','','']);
    n.modal.forEach(a=>body.push([a.code, a.name, fmtRp(a.bal)]));
    body.push(['','Laba Berjalan', fmtRp(n.labaBerjalan)]);
    body.push(['','Total Modal', fmtRp(n.totalModal)]);
    return {title:key==='neracabulan'?'Neraca Bulan Berjalan':'Neraca Akhir Tahun', head:['Kode','Nama Akun','Saldo'], body, opts:{filename:key, subtitle:'per '+fmtDate(asOf)}};
  }
  if(key==='labarugi'){
    const y=S.draft.lrTahun||new Date().getFullYear(); const start=y+'-01-01'; const end=(y+'-12-31')<today?(y+'-12-31'):today;
    const lr = labaRugi(start,end);
    const body=[];
    body.push(['Pendapatan','']);
    lr.detailPendapatan.forEach(a=>body.push([a.name, fmtRp(a.bal)]));
    body.push(['Total Pendapatan', fmtRp(lr.pendapatan)]);
    body.push(['HPP','']);
    lr.detailHpp.forEach(a=>body.push([a.name, fmtRp(a.bal)]));
    body.push(['Laba Kotor', fmtRp(lr.labaKotor)]);
    body.push(['Beban','']);
    lr.detailBeban.forEach(a=>body.push([a.name, fmtRp(a.bal)]));
    body.push(['Laba Bersih', fmtRp(lr.labaBersih)]);
    return {title:'Laba Rugi Tahun Berjalan', head:['Uraian','Jumlah'], body, opts:{filename:'laba-rugi', subtitle:fmtDate(start)+' - '+fmtDate(end)}};
  }
  if(key==='kumulatif'){
    const y=S.draft.kumTahun||new Date().getFullYear(); const curMonth=(today.slice(0,4)==String(y))?Number(today.slice(5,7)):12;
    const months=[]; for(let m=1;m<=curMonth;m++) months.push(m);
    function periodLR(m){ const start=y+'-'+String(m).padStart(2,'0')+'-01'; const end=new Date(y,m,0).toISOString().slice(0,10); const realEnd=end<today?end:today; return labaRugi(start,realEnd); }
    const head=['Uraian', ...months.map(m=>MONTH_NAMES[m-1]), 'Kumulatif'];
    const rowsData = months.map(m=>periodLR(m));
    const cum = labaRugi(y+'-01-01', today<(y+'-12-31')?today:(y+'-12-31'));
    const body=[
      ['Pendapatan', ...rowsData.map(r=>fmtRp(r.pendapatan)), fmtRp(cum.pendapatan)],
      ['HPP', ...rowsData.map(r=>fmtRp(r.hpp)), fmtRp(cum.hpp)],
      ['Laba Kotor', ...rowsData.map(r=>fmtRp(r.labaKotor)), fmtRp(cum.labaKotor)],
      ['Beban', ...rowsData.map(r=>fmtRp(r.beban)), fmtRp(cum.beban)],
      ['Laba Bersih', ...rowsData.map(r=>fmtRp(r.labaBersih)), fmtRp(cum.labaBersih)],
    ];
    return {title:'Laporan Kumulatif '+y, head, body, opts:{filename:'kumulatif-'+y, landscape:true}};
  }
  if(key==='rincian'){
    const end=S.draft.rincEnd||today; const data=rincianData(end);
    const body=[];
    data.forEach(sg=>{ body.push([sg.label,'',fmtRp(sg.superTotal)]); sg.kelompokList.forEach(k=>{ body.push(['  '+k.kelompok,'',fmtRp(k.subtotal)]); k.rows.forEach(a=>body.push([a.code,a.name,fmtRp(a.bal)])); }); });
    return {title:'Rincian Laporan Keuangan', head:['Kode','Nama Akun','Saldo'], body, opts:{filename:'rincian-laporan-keuangan', subtitle:'per '+fmtDate(end)}};
  }
  if(key==='laporanpenjualan'){
    const start=S.draft.lpStart||'', end=S.draft.lpEnd||today, custFilter=S.draft.lpCustomer||'';
    const rows=[];
    S.sales.filter(s=>s.status==='approved').forEach(s=>{ const tgl=effDate(s); if(start&&tgl<start) return; if(end&&tgl>end) return; if(custFilter&&s.customerId!==custFilter) return;
      (s.items||[]).forEach(it=> rows.push([fmtDate(tgl), s.noFaktur, s.customerNama, it.itemNama, it.qty, fmtRp(it.harga), (it.diskon||0)+'%', fmtRp(it.nominal), fmtRp(s.total)]));
    });
    return {title:'Laporan Penjualan', head:['Tanggal','No.Faktur','Konsumen','Barang','Qty','Harga','Diskon','Nominal','Grand Total'], body:rows, opts:{filename:'laporan-penjualan', landscape:true}};
  }
  if(key==='kartupiutang' || key==='kartuhutang'){
    const isPiutang = key==='kartupiutang';
    const parties = isPiutang? S.customers:S.vendors; const docs = isPiutang? S.sales.filter(s=>s.status==='approved'):S.purchases;
    const body=[];
    parties.forEach(p=>{ const open = docs.filter(d=>(isPiutang?d.customerId:d.vendorId)===p.id && (d.total-d.dibayar)>0.5); if(!open.length) return;
      body.push([p.kode+' - '+p.nama,'','','','']);
      open.forEach(d=>{ const docDate=isPiutang?effDate(d):d.tanggal; const jt=addDays(docDate,p.termHari||0); body.push(['',d.noFaktur, fmtDate(docDate), fmtDate(jt), fmtRp(d.total-d.dibayar)]); });
    });

  }
  if(key==='pelunasanpiutang' || key==='pelunasanhutang'){
    const isPiutang = key==='pelunasanpiutang';
    const start=S.draft.pelStart||'', end=S.draft.pelEnd||today;
    const sumber = isPiutang?'pembayaran-piutang':'pembayaran-hutang';
    const entries = S.journal.filter(e=>e.sumber===sumber && (!start||e.tanggal>=start) && (!end||e.tanggal<=end));
    const body = entries.map(e=>{ const partyId=isPiutang?e.customerId:e.vendorId; const partyName=isPiutang?custName(partyId):vendName(partyId); const inv=isPiutang?S.sales.find(s=>s.id===e.invoiceId):S.purchases.find(p=>p.id===e.invoiceId); const jumlah=(e.lines.find(l=>l.debit>0)||{}).debit||0; return [fmtDate(e.tanggal), e.no, partyName, inv?inv.noFaktur:'-', fmtRp(jumlah)]; });
    return {title:isPiutang?'Daftar Pelunasan Piutang':'Daftar Pelunasan Hutang', head:['Tanggal','No.Bukti','Nama','No.Faktur','Nilai'], body, opts:{filename:key}};
  }
  if(key==='setup-akun'){
    const body = S.coa.map(a=>[a.code,a.name,a.type,a.kelompok||'', fmtRp(saldoAkun(a.code))]);
    return {title:'Daftar Akun', head:['Kode','Nama','Tipe','Kelompok','Saldo'], body, opts:{filename:'daftar-akun'}};

  }
  if(key==='setup-pelanggan'){
    const body = S.customers.map(c=>[c.kode,c.nama,c.kota||'',c.telp1||'',c.npwp||'']);
    return {title:'Daftar Pelanggan', head:['Kode','Nama','Kota','Telepon','NPWP'], body, opts:{filename:'daftar-pelanggan'}};
  }
  if(key==='setup-pemasok'){
    const body = S.vendors.map(v=>[v.kode,v.nama,v.kota||'',v.telp1||'',v.npwp||'']);
    return {title:'Daftar Pemasok', head:['Kode','Nama','Kota','Telepon','NPWP'], body, opts:{filename:'daftar-pemasok'}};
  }
  if(key==='setup-barang'){
    const body = S.items.map(i=>[i.kode,i.nama,i.satuan,i.stok,fmtRp(i.hpp),fmtRp(i.hargaJual||0),fmtRp(i.stok*i.hpp)]);
    return {title:'Daftar Barang', head:['Kode','Nama','Satuan','Stok','HPP','Harga Jual','Nilai'], body, opts:{filename:'daftar-barang'}};
  }
  if(key==='pembelian'){
    const body = S.purchases.map(p=>[fmtDate(p.tanggal), p.noFaktur, p.vendorNama, p.metode, fmtRp(p.subtotal), fmtRp(p.ppn), fmtRp(p.total), p.dibayar>=p.total-0.5?'Lunas':p.dibayar>0?'Sebagian':'Belum Bayar']);
    return {title:'Riwayat Pembelian', head:['Tanggal','No.Faktur','Pemasok','Metode','DPP','PPN','Total','Status'], body, opts:{filename:'riwayat-pembelian', landscape:true}};
  }
  if(key==='laporanpembelian'){
    const start=S.draft.lpbStart||'', end=S.draft.lpbEnd||today, vendFilter=S.draft.lpbVendor||'';
    const rows=[];

    }

  if(key==='kasbank'){

    return {title:'Mutasi '+(a?a.name:''), head:['Tanggal','No.','Keterangan','Masuk','Keluar','Saldo'], body, opts:{filename:'mutasi-'+which}};
  }
  if(key==='biaya'){

    return {title:'Riwayat Biaya', head:['Tanggal','Keterangan','Akun Beban','Jumlah'], body, opts:{filename:'riwayat-biaya'}};

  if(key==='otorisasi'){

  }
  if(key==='uangmuka'){
    const bodyT = S.dpReceived.map(d=>['Terima', fmtDate(d.tanggal), custName(d.customerId), d.keterangan||'', fmtRp(d.jumlah), fmtRp(d.terpakai), fmtRp(d.jumlah-d.terpakai)]);
    const bodyB = S.dpPaid.map(d=>['Bayar', fmtDate(d.tanggal), vendName(d.vendorId), d.keterangan||'', fmtRp(d.jumlah), fmtRp(d.terpakai), fmtRp(d.jumlah-d.terpakai)]);

}

/* ============================= LAPORAN: PERBANDINGAN (SUPER ADMIN) ============================= */
function withJournal(tempJournal, fn){ const orig=S.journal; S.journal=tempJournal; let result; try{ result=fn(); } finally { S.journal=orig; } return result; }
function simulatePendingEntries(){
  const pending = S.sales.filter(s=>s.status==='pending'||!s.status);
  const entries=[];
  pending.forEach(sale=>{
    let totalHpp=0; const byAkun={};
    (sale.items||[]).forEach(it=>{
      const item = findItem(it.itemId);
      const estHpp = item? item.hpp*it.qty : 0;
      totalHpp += estHpp;
      const akunP = (item&&item.akunPenjualan)||'4000';
      byAkun[akunP] = (byAkun[akunP]||0)+it.nominal;
    });
    const akunKasLawan = sale.metode==='Tunai'?'1000':sale.metode==='Transfer'?'1010':'1100';
    const lines=[{akun:akunKasLawan,debit:sale.total,credit:0}];
    Object.entries(byAkun).forEach(([akun,val])=>lines.push({akun,debit:0,credit:val}));
    lines.push({akun:'2100',debit:0,credit:sale.ppn});
    lines.push({akun:'5000',debit:totalHpp,credit:0});
    lines.push({akun:'1200',debit:0,credit:totalHpp});
    entries.push({id:'sim-'+sale.id, tanggal:todayISO(), keterangan:'[SIMULASI BELUM OTORISASI] '+sale.noFaktur, sumber:'simulasi-pending', lines});
  });
  return entries;
}

document.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action, id = t.dataset.id;

  if(action==='toggleGroup'){ if(!S.collapsed) S.collapsed={}; S.collapsed[id] = !isCollapsed(id); render(); return; }
  if(action==='toggleSidebar'){ document.getElementById('shell').classList.toggle('sidebar-open'); return; }
  if(action==='closeSidebar'){ document.getElementById('shell').classList.remove('sidebar-open'); return; }
  if(action==='logout'){
    if(!confirm('Keluar dari sesi ini?')) return;
    logActivity('Logout');
    currentUser = null;
    document.getElementById('shell').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('form-login').reset();
    document.getElementById('login-error').textContent = '';
    return;
  }
  if(action==='nav'){ S.tab=id; S.draft={}; document.getElementById('shell').classList.remove('sidebar-open'); render(); return; }
  if(action==='exportPdf'){ exportPdf(id); return; }
  if(action==='exportExcel'){ exportExcel(id); return; }
  if(action==='printInvoice'){ printInvoice(id,'download'); return; }
  if(action==='printInvoiceDirect'){ printInvoice(id,'print'); return; }

  if(action==='backupExport'){
    const data = {coa:S.coa,journal:S.journal,items:S.items,sales:S.sales,purchases:S.purchases,assets:S.assets,customers:S.customers,vendors:S.vendors,meta:S.meta};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='backup-akuntansi-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    return;
  }
  if(action==='backupRestore'){ document.getElementById('file-restore').click(); return; }
  if(action==='cleanOrphanJournal'){
    const orphans = S.journal.filter(e=>{
      if(e.sumber==='saldo-awal'){
        if(e.itemId!==undefined && e.itemId!==null && e.itemId!=='') return !findItem(e.itemId);
        if(e.refCode) return !acc(e.refCode);
        if(e.customerId) return !S.customers.some(c=>c.id===e.customerId);
        if(e.vendorId) return !S.vendors.some(v=>v.id===e.vendorId);
      }
      if(e.sumber==='perolehan-aset' && e.assetId) return !S.assets.some(a=>a.id===e.assetId);
      return false;
    });
    if(!orphans.length){ alert('Tidak ditemukan jurnal yatim. Data sudah sinkron.'); return; }
    if(!confirm('Ditemukan '+orphans.length+' jurnal yatim (saldo awal/perolehan aset dari data yang sudah terhapus, tapi jurnalnya masih tertinggal). Hapus semua sekarang? Saldo di Neraca Saldo & Rincian Laporan Keuangan akan ikut terkoreksi.')) return;
    const orphanIds = new Set(orphans.map(e=>e.id));
    S.journal = S.journal.filter(e=>!orphanIds.has(e.id));
    await saveKey('journal', S.journal);
    alert(orphans.length+' jurnal yatim berhasil dibersihkan.');
    render(); return;
  }
  if(action==='tutupBuku'){
    if(!hasPermission('tutupBuku')){ alert('Hanya Super Admin yang dapat melakukan tutup buku.'); return; }
    const period = id;
    if(!confirm('Tutup buku periode '+MONTH_NAMES[Number(period.slice(5,7))-1]+' '+period.slice(0,4)+'?\nSetelah ditutup, TIDAK ADA transaksi baru yang bisa diposting dengan tanggal di bulan ini atau sebelumnya. Tindakan ini bisa dibuka kembali lewat tombol "Buka Kembali" bila diperlukan.')) return;
    S.meta.tutupBukuSampai = period;
    await saveKey('meta', S.meta);
    await logActivity('Tutup buku periode '+period);
    alert('Buku periode '+period+' berhasil ditutup.');
    render(); return;
  }
  if(action==='bukaTutupBuku'){
    if(!hasPermission('tutupBuku')){ alert('Hanya Super Admin yang dapat membuka kembali tutup buku.'); return; }
    if(!confirm('Buka kembali periode '+id+'? Transaksi pada bulan ini akan bisa diedit/ditambah lagi.')) return;
    const [y,m] = id.split('-').map(Number);
    let py=y, pm=m-1; if(pm<1){pm=12;py--;}
    S.meta.tutupBukuSampai = (S.journal.some(e=>monthKey(e.tanggal)<id) ) ? (py+'-'+String(pm).padStart(2,'0')) : '';
    if(S.meta.tutupBukuSampai===id) S.meta.tutupBukuSampai='';
    await saveKey('meta', S.meta);
    await logActivity('Buka kembali tutup buku periode '+id);
    render(); return;
  }
  if(action==='exportCsv'){
    let csv='', filename='export.csv';
    if(id==='coa'){ csv='code,name,type,kelompok,saldoAwal\n'+S.coa.map(a=>`${a.code},"${a.name}",${a.type},"${a.kelompok||''}",${a.saldoAwal||0}`).join('\n'); filename='daftar-akun.csv'; }
    if(id==='customers'){ csv='kode,nama,alamat1,alamat2,kota,kodepos,telp1,telp2,fax,npwp,kontak,keterangan,termHari,saldoAwal\n'+S.customers.map(c=>`${c.kode},"${c.nama}","${c.alamat1||''}","${c.alamat2||''}","${c.kota||''}",${c.kodepos||''},${c.telp1||''},${c.telp2||''},${c.fax||''},${c.npwp||''},"${c.kontak||''}","${c.keterangan||''}",${c.termHari||0},${c.saldoAwal||0}`).join('\n'); filename='daftar-pelanggan.csv'; }
    if(id==='vendors'){ csv='kode,nama,alamat1,alamat2,kota,kodepos,telp1,telp2,fax,npwp,kontak,keterangan,termHari,saldoAwal\n'+S.vendors.map(v=>`${v.kode},"${v.nama}","${v.alamat1||''}","${v.alamat2||''}","${v.kota||''}",${v.kodepos||''},${v.telp1||''},${v.telp2||''},${v.fax||''},${v.npwp||''},"${v.kontak||''}","${v.keterangan||''}",${v.termHari||0},${v.saldoAwal||0}`).join('\n'); filename='daftar-pemasok.csv'; }
    if(id==='items'){ csv='kode,nama,satuan,akunPenjualan,stok,hpp,hargaJual\n'+S.items.map(i=>`${i.kode},"${i.nama}",${i.satuan},${i.akunPenjualan},${i.stok},${i.hpp},${i.hargaJual||0}`).join('\n'); filename='daftar-barang.csv'; }
    if(id==='journal'){ csv='tanggal,no,keterangan,sumber,akun,debit,kredit\n'+S.journal.flatMap(e=>e.lines.map(l=>`${e.tanggal},${e.no},"${e.keterangan}",${e.sumber},${l.akun},${l.debit||0},${l.credit||0}`)).join('\n'); filename='jurnal.csv'; }
    download(filename, csv); return;
  }
  if(action==='importCsv'){ document.getElementById('file-import-'+id).click(); return; }

  if(action==='deleteAkun'){
    const dipakai = S.journal.some(e=> e.sumber!=='saldo-awal' && e.lines.some(l=>l.akun===id));
    if(dipakai){ alert('Akun '+id+' tidak bisa dihapus karena sudah dipakai di transaksi lain. Hapus/koreksi transaksinya dulu, atau biarkan akun ini tetap ada meski tidak dipakai lagi.'); return; }
    if(!confirm('Hapus akun '+id+'? Jurnal saldo awal akun ini (jika ada) akan ikut dihapus dan saldo akan kembali ke nol.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.refCode===id));
    S.coa=S.coa.filter(a=>a.code!==id);
    await saveKey('journal',S.journal); await saveKey('coa',S.coa); render(); return;
  }
  if(action==='deleteCustomer'){
    const dipakai = S.sales.some(s=>s.customerId===id && s.sumber!=='saldo-awal') || S.journal.some(e=>e.customerId===id && e.sumber!=='saldo-awal');
    if(dipakai){ alert('Pelanggan ini tidak bisa dihapus karena sudah memiliki transaksi penjualan/pembayaran. Hapus transaksinya dulu bila memang perlu.'); return; }
    if(!confirm('Hapus pelanggan ini? Saldo awal piutang (jika ada) akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.customerId===id));
    S.sales = S.sales.filter(s=> !(s.customerId===id && s.sumber==='saldo-awal'));
    S.customers=S.customers.filter(c=>c.id!==id);
    await saveKey('journal',S.journal); await saveKey('sales',S.sales); await saveKey('customers',S.customers); render(); return;
  }
  if(action==='deleteVendor'){
    const dipakai = S.purchases.some(p=>p.vendorId===id && p.sumber!=='saldo-awal') || S.journal.some(e=>e.vendorId===id && e.sumber!=='saldo-awal');
    if(dipakai){ alert('Pemasok ini tidak bisa dihapus karena sudah memiliki transaksi pembelian/pembayaran. Hapus transaksinya dulu bila memang perlu.'); return; }
    if(!confirm('Hapus pemasok ini? Saldo awal hutang (jika ada) akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.vendorId===id));
    S.purchases = S.purchases.filter(p=> !(p.vendorId===id && p.sumber==='saldo-awal'));
    S.vendors=S.vendors.filter(v=>v.id!==id);
    await saveKey('journal',S.journal); await saveKey('purchases',S.purchases); await saveKey('vendors',S.vendors); render(); return;
  }
  if(action==='deleteItem'){
    const dipakaiTransaksi = S.sales.some(s=>(s.items||[]).some(it=>it.itemId===id)) || S.purchases.some(p=>(p.items||[]).some(it=>it.itemId===id));
    if(dipakaiTransaksi){ alert('Barang ini tidak bisa dihapus karena sudah dipakai dalam transaksi penjualan/pembelian. Riwayat transaksi harus tetap merujuk ke barang ini.'); return; }
    if(!confirm('Hapus barang ini? Jurnal saldo awal persediaan (jika ada) akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='saldo-awal' && e.itemId===id));
    S.items=S.items.filter(i=>i.id!==id);
    await saveKey('journal',S.journal); await saveKey('items',S.items); render(); return;
  }
  if(action==='deleteAsset'){
    const a = S.assets.find(x=>x.id===id);
    if(a && a.akumulasi>0){ alert('Aset ini tidak bisa dihapus karena sudah pernah disusutkan. Koreksi lewat Jurnal Transaksi bila diperlukan.'); return; }
    if(!confirm('Hapus aset ini? Jurnal perolehannya akan ikut dihapus.')) return;
    S.journal = S.journal.filter(e=> !(e.sumber==='perolehan-aset' && e.assetId===id));
    S.assets = S.assets.filter(x=>x.id!==id);
    await saveKey('journal',S.journal); await saveKey('assets',S.assets); render(); return;
  }
  if(action==='editAkun'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.akun=id; render(); return; }
  if(action==='editCustomer'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.customer=id; render(); return; }
  if(action==='editVendor'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.vendor=id; render(); return; }
  if(action==='editItem'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.item=id; render(); return; }
  if(action==='editAsset'){ if(!S.draft.editing) S.draft.editing={}; S.draft.editing.asset=id; render(); return; }
  if(action==='editUser'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin.'); return; }
    if(!S.draft.editing) S.draft.editing={}; S.draft.editing.user=id; render(); return;
  }
  if(action==='deleteUser'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin.'); return; }
    if(id===currentUser.id){ alert('Tidak bisa menghapus akun yang sedang login.'); return; }
    if(S.users.length<=1){ alert('Tidak bisa menghapus user terakhir.'); return; }
    if(!confirm('Hapus user ini?')) return;
    S.users = S.users.filter(u=>u.id!==id);
    await saveKey('users', S.users);
    await logActivity('Hapus user id '+id);
    render(); return;
  }
  if(action==='cancelEdit'){ if(S.draft.editing) S.draft.editing[id]=null; render(); return; }
  if(action==='deleteJurnal'){ if(!confirm('Hapus jurnal ini?')) return; S.journal=S.journal.filter(j=>j.id!==id); await saveKey('journal',S.journal); render(); return; }

  if(action==='addJurnalLine'){ S.draft.journalLines.push({akun:'',debit:'',credit:''}); render(); return; }
  if(action==='removeJurnalLine'){ S.draft.journalLines.splice(Number(id),1); render(); return; }
  if(action==='addSaleLine'){ S.draft.saleItems.push({itemId:'',qty:1,harga:0,diskon:0,noBatch:'',tglEd:''}); render(); return; }
  if(action==='removeSaleLine'){ S.draft.saleItems.splice(Number(id),1); render(); return; }
  if(action==='addPurchaseLine'){ S.draft.purchaseItems.push({itemId:'',qty:1,harga:0,diskon:0,noBatch:'',tglEd:''}); render(); return; }
  if(action==='removePurchaseLine'){ S.draft.purchaseItems.splice(Number(id),1); render(); return; }

  if(action==='hpTab'){ S.draft.hpTab=id; render(); return; }
  if(action==='dpTab'){ S.draft.dpTab=id; render(); return; }
  if(action==='returTab'){ S.draft.returTab=id; render(); return; }

  if(action==='approveSale'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin yang dapat melakukan otorisasi penjualan.'); return; }
    const sale = S.sales.find(s=>s.id===id); if(!sale){ return; }
    if(sale.status==='approved'){ return; }
    const tglOtorisasi = todayISO();
    if(isPeriodClosed(tglOtorisasi)){ alert('Tidak bisa otorisasi: periode '+monthKey(tglOtorisasi)+' sudah ditutup buku.'); return; }
    if(!confirm('Otorisasi penjualan '+sale.noFaktur+' sebesar '+fmtRp(sale.total)+'?\nTransaksi akan diakui sebagai penjualan resmi PER TANGGAL HARI INI ('+fmtDate(tglOtorisasi)+') dan masuk laporan keuangan bulan '+MONTH_NAMES[Number(tglOtorisasi.slice(5,7))-1]+' '+tglOtorisasi.slice(0,4)+'.\nStok akan berkurang dan jurnal akan terbentuk setelah ini.')) return;
    const namaOtorisator = prompt('Nama yang mengotorisasi transaksi ini:'); if(namaOtorisator===null) return;
    for(const it of (sale.items||[])){
      const item = findItem(it.itemId);
      if(item && it.qty>item.stok){ alert('Stok '+item.nama+' tidak cukup (tersedia '+item.stok+'). Otorisasi dibatalkan untuk baris ini — periksa stok lalu coba lagi.'); return; }
    }
    let totalHpp=0; const byAkun={};
    for(const it of (sale.items||[])){
      const h = await stockOut(it.itemId, it.qty);
      it.hppTotal = h; it.qtyRetur = 0;
      totalHpp += h;
      const item = findItem(it.itemId);
      const akunP = (item&&item.akunPenjualan) || '4000';
      byAkun[akunP] = (byAkun[akunP]||0) + it.nominal;
    }
    const akunKasLawan = sale.metode==='Tunai'?'1000':sale.metode==='Transfer'?'1010':'1100';
    const lines=[{akun:akunKasLawan,debit:sale.total,credit:0}];
    Object.entries(byAkun).forEach(([akun,val])=> lines.push({akun,debit:0,credit:val}));
    lines.push({akun:'2100',debit:0,credit:sale.ppn});
    lines.push({akun:'5000',debit:totalHpp,credit:0});
    lines.push({akun:'1200',debit:0,credit:totalHpp});
    await postJournal({tanggal:tglOtorisasi,keterangan:'Penjualan '+sale.noFaktur+' - '+sale.customerNama+' (dicatat '+fmtDate(sale.tanggal)+')',sumber:'penjualan',customerId:sale.customerId,invoiceId:sale.id,lines});
    sale.status='approved';
    sale.tanggalOtorisasi = tglOtorisasi;
    sale.dibayar = sale.metode==='Piutang'?0:sale.total;
    sale.approvedBy = namaOtorisator||'-'; sale.approvedAt = new Date().toISOString();
    await logActivity('Otorisasi penjualan '+sale.noFaktur+' ('+fmtRp(sale.total)+')');
    await saveKey('sales',S.sales);
    render(); return;
  }
  if(action==='rejectSale'){
    if(!currentUser || currentUser.role!=='superadmin'){ alert('Hanya Super Admin yang dapat menolak transaksi penjualan.'); return; }
    const sale = S.sales.find(s=>s.id===id); if(!sale) return;
    const namaOtorisator = prompt('Nama yang menolak transaksi ini:'); if(namaOtorisator===null) return;
    if(!confirm('Tolak transaksi penjualan '+sale.noFaktur+'? Tindakan ini permanen.')) return;
    sale.status='rejected'; sale.approvedBy = namaOtorisator||'-'; sale.approvedAt = new Date().toISOString();
    await saveKey('sales',S.sales); render(); return;
  }
  if(action==='runDepreciation'){
    const endPeriod = monthKey(todayISO()); let posted=0; let totalBulan=0;
    if(isPeriodClosed(todayISO())){ alert('Tidak bisa posting: periode '+endPeriod+' sudah ditutup buku.'); return; }
    for(const a of S.assets){
      const maxDepr = a.harga-(a.residu||0);
      if(a.akumulasi >= maxDepr-1) continue;
      const monthly = Math.max(0, maxDepr/(a.umur*12));
      const startPeriod = a.lastDeprPeriod ? nextPeriod(a.lastDeprPeriod) : monthKey(a.tanggal);
      if(startPeriod > endPeriod) continue;
      const n = periodsCount(startPeriod, endPeriod);
      let amount = Math.min(monthly*n, maxDepr-a.akumulasi);
      if(amount<=0) continue;
      const label = n>1 ? (startPeriod+' s.d '+endPeriod+' — '+n+' bulan') : endPeriod;
      await postJournal({tanggal:todayISO(), keterangan:'Penyusutan '+a.nama+' periode '+label, sumber:'penyusutan', lines:[{akun:'6030',debit:amount,credit:0},{akun:'1901',debit:0,credit:amount}]});
      a.akumulasi += amount; a.lastDeprPeriod = endPeriod; posted++; totalBulan += n;
    }
    await saveKey('assets',S.assets); alert(posted+' aset berhasil disusutkan (total '+totalBulan+' bulan tercakup, termasuk bulan yang tertunggak bila ada) hingga periode '+endPeriod+'.'); render(); return;
  }
});
